name: Build UAC2 Kernel Module

# 为什么需要这个 workflow
# ------------------------
# 目标：让词典笔通过 USB 被电脑识别成「免驱音频设备」（电脑端零安装）。
# 电脑端零安装的 USB 音频只有一条标准路径：USB Audio Class（UAC）。
#
# 但设备内核实测缺两样东西：
#   1) configfs 建不出 uac2.0 —— 内核没编 f_uac2 / u_audio
#      （用原厂脚本的真实实例名 uac1.gs0/uac2.gs0/uac1.0/audio.0 复测，全部 ENOENT）
#   2) FunctionFS 也写不出 UAC 描述符 —— 4.4 的 f_fs.c 里 ffs_do_single_desc()
#      对 bDescriptorType 是精确 switch，只认 INTERFACE(0x04)/ENDPOINT(0x05)/
#      HID_DT_HID(0x21)/OTG(0x09)/IASSOC(0x0B)/SS_EP_COMP(0x30)，其余落 default
#      直接 -EINVAL。UAC 必需的 CS_INTERFACE(0x24)/CS_ENDPOINT(0x25) 必然被拒。
#      （实测：0x21 能过不是「透传」，而是它恰好等于 HID_DT_HID）
#
# 唯一的出路：自己编 f_uac2.ko + u_audio.ko 加载进内核。实测这三条同时成立：
#   * CONFIG_MODULES=y      —— /proc/modules 里真跑着 hci_uart / 8723ds
#   * CONFIG_MODVERSIONS=n  —— 现有 .ko 里 __crc_ 符号数 = 0
#                              ⇒ 不需要 Module.symvers，**不必编译整个内核**
#   * 模块未签名、modules_disabled=0
#   * vermagic = 4.4.159 SMP mod_unload aarch64（精确版本已知）
#   * f_uac2 依赖的 gadget 核心符号（usb_add_function / usb_ep_autoconfig /
#     config_ep_by_speed ...）与 ALSA 符号在设备 kallsyms 中全部存在
#
# 因为 vermagic 里的版本号必须严格是 4.4.159，而 4.4.159 恰好是上游正式发布版，
# 直接取 kernel.org 的源码即可拿到天然匹配的 vermagic，无需手工篡改。
#
# ⚠️ 本 workflow 只负责「编译 + 静态校验」，**不接触设备**。
#    加载与验证在本地用 adb 分台阶做（见 tools/uac2-kmod/ 注释）。

on:
  # workflow_dispatch 端点只对「默认分支上存在的 workflow」注册，本文件目前
  # 只在 fix/batch1-safety-perf 上，直接 dispatch 会 404，因此主入口走 push：
  # 改动模块源码或本文件即自动重编，方便多轮迭代。
  push:
    paths:
      - 'tools/uac2-kmod/**'
      - '.github/workflows/build-uac2-kmod.yaml'
  workflow_dispatch:
    inputs:
      kernel_version:
        description: '目标内核版本（必须与设备 vermagic 一致，当前 = 4.4.159）'
        required: true
        default: '4.4.159'

env:
  KVER: ${{ github.event.inputs.kernel_version || '4.4.159' }}
  CROSS: aarch64-linux-gnu-

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: 安装构建依赖
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            build-essential bc flex bison libssl-dev libelf-dev \
            wget xz-utils gcc-aarch64-linux-gnu
          # 用系统 GCC 11 编 host 工具（modpost/fixdep）。
          # 不用 archlinux:latest 是因为它的 GCC 14+ 会把
          # implicit-function-declaration 升级成 error，编不过 4.4 的老脚本。
          aarch64-linux-gnu-gcc --version | head -1
          gcc --version | head -1

      - name: 检出代码
        uses: actions/checkout@v4

      - name: 缓存内核源码包
        id: cache-ksrc
        uses: actions/cache@v4
        with:
          path: linux-${{ env.KVER }}.tar.xz
          key: linux-src-tar-${{ env.KVER }}

      - name: 下载内核源码
        if: steps.cache-ksrc.outputs.cache-hit != 'true'
        run: |
          wget -q "https://cdn.kernel.org/pub/linux/kernel/v4.x/linux-${KVER}.tar.xz"
          ls -la "linux-${KVER}.tar.xz"

      - name: 解压内核源码
        run: |
          tar xf "linux-${KVER}.tar.xz"
          ls -d "linux-${KVER}"
          head -5 "linux-${KVER}/Makefile"

      - name: 配置内核并准备模块头文件
        run: |
          cd "linux-${KVER}"
          make ARCH=arm64 CROSS_COMPILE="${CROSS}" defconfig
          # 关掉会引入 libssl 3.x 不兼容的签名相关项（省掉 extract-cert 编译坑）
          ./scripts/config \
            --disable MODULE_SIG --disable MODULE_SIG_ALL \
            --disable SYSTEM_TRUSTED_KEYRING --disable SYSTEM_REVOCATION_KEYS \
            --disable MODULE_SIG_FORCE || true
          # 打开 UAC2 / ALSA 依赖，让 f_uac2.c 能拿到完整的 sound / gadget 头文件
          # （4.4 的实际开关名是 USB_F_UAC2，由 USB_CONFIGFS_F_UAC2 select）
          ./scripts/config \
            --enable SND --enable SND_PCM --enable SND_PCM_ELD \
            --enable USB_GADGET --enable USB_LIBCOMPOSITE \
            --enable USB_CONFIGFS --enable USB_CONFIGFS_F_UAC2 || true
          # ⚠️ 必须关掉 PREEMPT：上游 arm64 defconfig 开着 CONFIG_PREEMPT，编出来的
          #    vermagic 是 "4.4.159 SMP preempt mod_unload aarch64"，而设备实测是
          #    "4.4.159 SMP mod_unload aarch64"（无 preempt）。差一个词就 insmod 不了
          #    （invalid module format），而且 PREEMPT 本身也会影响部分结构体布局。
          ./scripts/config \
            --disable PREEMPT --disable PREEMPT_VOLUNTARY \
            --enable PREEMPT_NONE --disable PREEMPT_COUNT || true
          # ★★ 关掉 tracing 家族
          #
          # 实测证据：原厂 hci_uart.ko / 8723ds.ko 的 .gnu.linkonce.this_module
          # 节大小都是 704，而用上游 arm64 defconfig 编出来的是 768 —— 差 64 字节。
          # 后果：内核按**它自己的**偏移往这块内存里读写字段，我们读的是**我们的**
          # 偏移 ⇒ /proc/modules 里 refcount 打出 9400318 这种垃圾值（其实是
          # module_core 基址 0x8F7000 附近），rmmod 报 EAGAIN
          # ("Resource temporarily unavailable")。
          #
          # 判据是设备 /proc/kallsyms 里的函数符号（数据符号列不全，但够用）：
          #   | 判据（kallsyms 里的符号）        | 设备 | 结论                        |
          #   | static_key*/jump_label* 计数     |  0   | CONFIG_JUMP_LABEL=n         |
          #   | *ftrace* 计数 / /sys/kernel/tracing | 0 / 无 | FTRACE/TRACING/TRACEPOINTS |
          #   |                                  |      | /EVENT_TRACING 全 = n       |
          #   | klp_enable_patch                 |  无  | CONFIG_LIVEPATCH=n          |
          #   | mod_verify_sig                   |  无  | CONFIG_MODULE_SIG=n         |
          #   | module_refcount/try_module_get   | 有   | CONFIG_MODULE_UNLOAD=y      |
          #   | kallsyms_lookup_name             | 有   | CONFIG_KALLSYMS=y（ALL=n）  |
          # ⇒ 设备把整个 tracing 子系统砍了，而那正好是 struct module 里
          #   TRACEPOINTS / HAVE_JUMP_LABEL / TRACING / EVENT_TRACING /
          #   FTRACE_MCOUNT_RECORD 这 5 个 #ifdef 块。
          # 另外用户栈顶 0x7ff4039000 紧贴 0x8000000000 ⇒ VA_BITS=39（上游是 48），
          # 一并还原以求配置忠实（这一项不改变 struct module 大小）。
          ./scripts/config \
            --disable FTRACE --disable FUNCTION_TRACER --disable DYNAMIC_FTRACE \
            --disable FTRACE_MCOUNT_RECORD --disable STACK_TRACER \
            --disable FUNCTION_GRAPH_TRACER --disable TRACING \
            --disable TRACEPOINTS --disable EVENT_TRACING \
            --disable TRACEPOINT_BENCHMARK --disable TRACER_SNAPSHOT \
            --disable LIVEPATCH --disable JUMP_LABEL \
            --disable KALLSYMS_ALL --disable DEBUG_INFO --disable DEBUG_INFO_DWARF4 \
            --disable ARM64_VA_BITS_48 --enable ARM64_VA_BITS_39 \
            || true
          # ★★ 必须打开 CONFIG_DEBUG_SPINLOCK —— 厂商内核就是开的 ★★
          #
          # raw_spinlock_t 在 DEBUG_SPINLOCK=y 时从 4 字节变 24 字节
          # （多 magic / owner_cpu / owner），于是：
          #     spinlock_t          4 → 24
          #     struct mutex       40 → 64
          #     struct semaphore   24 → 48
          # 这不是"猜"：三份互相独立的实测证据全部指向同一个结论 ——
          #   A) 厂商 8723ds.ko 的 .bss 里
          #        GLBtcBtMpOperLock（realtek 的 `_lock` = struct mutex）size = 64
          #        wifi_control_sem / GLBtcBtMpRptSema（`_sema` = struct semaphore）size = 48
          #      —— DEBUG_SPINLOCK=n 时这两个只可能是 40 / 24。
          #   B) 厂商 .ko 的 struct module offsetof(init) = 368；本工作流的配置矩阵
          #      实测只有 `+DEBUG_SPINLOCK` 能把我们的 344 顶到 368（因为 struct
          #      module 里正好有 `#ifdef CONFIG_SYSFS struct mutex param_lock;`）。
          #   C) 上面两个尺寸与 A) 完全自洽（mutex 64 - semaphore 48 = 16，两种
          #      配置下差值都是 16，所以 64/48 这一对只能来自 DEBUG_SPINLOCK）。
          #
          # ⚠️ 为什么这条对本项目是**安全红线**而不是锦上添花：
          #   snd_card / snd_pcm_runtime / snd_pcm_substream / usb_gadget 这些
          #   结构体内部都有 spinlock_t / struct mutex。偏移一错，usb_uac2.ko 就会
          #   读写内核结构体的错误字段 —— 那是真的会搞坏内核，而不是"加载失败而已"。
          ./scripts/config --enable DEBUG_KERNEL --enable DEBUG_SPINLOCK || true
          make ARCH=arm64 CROSS_COMPILE="${CROSS}" olddefconfig
          # ★★ L1_CACHE_BYTES = 64（不是 arm64 主线的 128）★★
          #
          # `struct module` 以 `} ____cacheline_aligned;` 结尾，所以它的尺寸必然是
          # 对齐数的整数倍。设备实测（原厂 .ko 直读）：
          #     .gnu.linkonce.this_module  sh_size = 704，sh_addralign = 64
          # 而 704 = 64×11 —— **不是 128 的整数倍** ⇒ 厂商内核的
          # `____cacheline_aligned` = SMP_CACHE_BYTES = L1_CACHE_BYTES = 64。
          # arm64 主线 arch/arm64/include/asm/cache.h 里是
          #     #define L1_CACHE_SHIFT		7      → 128
          # 厂商改成了 6 → 64（Cortex-A35 的 L1 行本来就是 64 字节）。
          # 上一步 `set_cache_shift 7` 的实测对照：
          #     SHIFT=7 → size=768    SHIFT=6 → size=704   ← 与设备一致
          # 只改这一个宏：它只影响 `____cacheline_aligned` 的使用者，而我们的
          # 模块里几乎没有；不碰任何 Kconfig。
          CACHEH=arch/arm64/include/asm/cache.h
          echo "--- 原样 ---"; grep -n '^#define L1_CACHE_SHIFT' "$CACHEH"
          sed -i 's/^#define L1_CACHE_SHIFT.*/#define L1_CACHE_SHIFT\t\t6/' "$CACHEH"
          echo "--- 修正后 ---"; grep -n '^#define L1_CACHE_SHIFT' "$CACHEH"
          if ! grep -qE '^#define L1_CACHE_SHIFT[[:space:]]+6$' "$CACHEH"; then
            echo "❌ L1_CACHE_SHIFT 补丁没打上（锚点不匹配？）；直接失败，避免静默产出错布局"
            exit 1
          fi
          # ★★ 第二处 ABI 复刻：configfs 的 struct config_group（+8 字节）★★
          #
          # 实测路径（全部来自真机，不是推演）：
          #  1) abiprobe.ko 调用内核的 config_group_init_type_name() 写我们自己
          #     kzalloc 的内存，再扫描内核写下的特征值：
          #       内核自指 list_head @ 32  ↔  我们 ci_entry     @ 32   ✓
          #       内核自指 list_head @ 80  ↔  我们 cg_children  @ 80   ✓
          #       内核名字串写在 8         ↔  我们 ci_namebuf  @ 8    ✓
          #       内核 ci_name 指针 @ 0    ↔  我们 ci_name      @ 0    ✓
          #     ⇒ struct config_item 完全一致（80 字节）。
          #  2) 真机上 mkdir/rmdir functions/uac2.0 的两次 oops 反推出内核的
          #     usb_function_instance 真实偏移（内嵌 config_group，所以两者联动）：
          #       内核 fd=136  set_inst_name=144  free_func_inst=152
          #     推理：
          #       · 内核把 fi->fd 写在 136（落在我们的 cfs_list 里，无害）
          #       · function_make() 检查 `if (fi->set_inst_name)` → 读我们的 144
          #         是 0（我们从没赋过 set_inst_name）⇒ 跳过 ⇒ mkdir 才没崩
          #       · rmdir 时 usb_put_function_instance() 调 `fi->free_func_inst`
          #         → 读我们的 152 = 0 ⇒ 调到 NULL ⇒ oops（这才是那次崩溃）
          #     ⇒ 内核的 offsets 比"上游 4.4.159 + 12 字节"小 8。
          #  3) 换算：cfs_list 紧跟 group，所以
          #       sizeof(内核 config_group) = 136 - 16 = 120 = 我们上游的 112 + 8
          #     ➜ 尾部差 8 字节，来源正是 configfs 的 `default_groups` 改造：
          #         上游 4.4.159 ： struct config_group **default_groups;  （8）
          #         设备内核     ： struct list_head       default_groups;  （16）
          #       厂商把 `default_groups` 从"指针数组"回移植成了"list_head"。
          #
          # ⚠️ 我一开始按"list_head + default_groups_array"补了 16 字节 —— 多了 8。
          #    症状很有欺骗性：mkdir 反而成功了（因为内核的 set_inst_name 落在我们
          #    的 0 上），只在 rmdir 时才崩。**判据必须是 mkdir + rmdir 都过。**
          python3 - <<'PYPATCH_CFG'
          import io, sys, re
          p = 'include/linux/configfs.h'
          s = io.open(p, encoding='utf-8').read()
          pat = re.compile(r'^[ \t]*struct config_group[ \t]+\*\*default_groups;[ \t]*$', re.M)
          hits = pat.findall(s)
          print('config_group **default_groups 锚点命中数 =', len(hits))
          if len(hits) != 1:
              sys.exit('❌ 锚点不是恰好 1 处，终止（不允许静默产出错布局）')
          new = (
              "\t/*\n"
              "\t * [PenMods ABI 复刻] 设备内核把 configfs 的 default_groups 从\n"
              "\t * `struct config_group **default_groups` 回移植成了\n"
              "\t * `struct list_head default_groups`（8 → 16 字节）。\n"
              "\t * 整个 struct config_group 因此是 120 而非上游的 112；\n"
              "\t * usb_function_instance 内嵌它，于是 fd/set_inst_name/\n"
              "\t * free_func_inst 的偏移全部 +8（实测 136/144/152）。\n"
              "\t * 不对齐的后果（真机 oops）：rmdir functions/uac2.0 时\n"
              "\t * usb_put_function_instance() 读到的 free_func_inst 是 0，\n"
              "\t * 直接调到 NULL ⇒ oops ⇒ panic_on_oops=1 ⇒ 设备重启。\n"
              "\t */\n"
              "\tstruct list_head\t\tdefault_groups;"
          )
          s = pat.sub(lambda _m: new, s, count=1)
          io.open(p, 'w', encoding='utf-8', newline='').write(s)
          print('configfs.h ABI 补丁已应用（+8）')
          PYPATCH_CFG
          grep -n 'default_groups' include/linux/configfs.h
          grep -n 'default_groups' include/linux/configfs.h

          # ★★★ 关于 struct module 的 init/exit 偏移 ★★★
          #
          # 实测（原厂 hci_uart.ko / 8723ds.ko 的重定位表，两份互相印证）：
          #     sh_size=704   offsetof(name)=24   offsetof(init)=368   offsetof(exit)=680
          # arm64 4.4.159 在上面这套配置下编出来的是 init=344 / exit=672。
          #
          # ⚠️ 曾经在这里用 python 往 include/linux/module.h 里插
          #    `char __penmods_abi_pad0[24]` / `__penmods_abi_pad1[8]` 来凑偏移，
          #    但**那段代码从未真正执行过**（CI 日志里整段缺失，诊断步的
          #    SHIFT=7 BASE 仍然读出 init=344 就是铁证），而 patch 又是"锚点不匹配
          #    就静默跳过"的写法 —— 于是变成了一个看不见的坑。
          #    现在改成**链接后确定性改写**：tools/uac2-kmod/layout-patch.py
          #    直接按原厂 .ko 实测出的偏移搬移那两条重定位，并且改完自校验、
          #    不达标就 exit 1。见后面的「ABI 修正」步骤。
          # 记录关键配置项，便于和设备的 vermagic 对照
          echo "=== 影响 vermagic 的关键项 ==="
          grep -E '^CONFIG_(SMP|PREEMPT|PREEMPT_VOLUNTARY|PREEMPT_NONE|MODULE_UNLOAD|MODVERSIONS|MODULE_SIG|ARM64_4K_PAGES|ARM64_VA_BITS)' .config | sort
          # 自检：不要把"配置没生效"变成静默错误（olddefconfig 的依赖解析、
          # scripts/config 的拼写错误都可能导致静默失败）
          for c in CONFIG_DEBUG_SPINLOCK CONFIG_DEBUG_KERNEL; do
            if grep -q "^${c}=y" .config; then
              echo "  ✅ ${c}=y"
            else
              echo "  ❌ ${c} 没打开 —— 含自旋锁/互斥锁的结构体会整体错位，终止"
              exit 1
            fi
          done
          grep -n '^#define L1_CACHE_SHIFT' arch/arm64/include/asm/cache.h
          # ⚠️ GCC 10+ 默认 -fno-common，而 4.4 里 flex/bison 预生成的 dtc 老代码
          #    （dtc-lexer.lex.c 与 dtc-parser.tab.c）**各自定义了一份 `YYLTYPE yylloc;`**，
          #    于是链接脚本时报 multiple definition of `yylloc`。给 host 工具加回 -fcommon
          #    即可（这里显式复刻 4.4 的默认 HOSTCFLAGS 再追加，避免命令行覆盖丢 flag）。
          HOST_FLAGS="-Wall -Wmissing-prototypes -Wstrict-prototypes -O2 -fomit-frame-pointer -std=gnu89 -fcommon"
          make ARCH=arm64 CROSS_COMPILE="${CROSS}" HOSTCFLAGS="$HOST_FLAGS" \
            modules_prepare -j"$(nproc)"

      - name: 诊断内核源码中的 UAC 文件
        run: |
          FN="linux-${KVER}/drivers/usb/gadget/function"
          echo "=== function 目录里的 uac / audio 相关文件 ==="
          ls -la "$FN" | grep -iE 'uac|audio' || echo "(无匹配)"
          echo "=== Makefile 中的 uac2 规则 ==="
          grep -n -iE 'uac2|u_audio|g_audio' "$FN/Makefile" || true
          echo "=== 全树搜索 u_audio.h ==="
          find "linux-${KVER}" -name 'u_audio.h' -o -name 'u_uac2.h' | head
          echo "=== f_uac2.c / u_audio.c 的本地 #include 依赖 ==="
          grep -ho '^#include "[^"]*"' "$FN/f_uac2.c" "$FN/u_audio.c" 2>/dev/null | sort -u || true

      - name: 组装 out-of-tree 模块目录
        run: |
          FN="linux-${KVER}/drivers/usb/gadget/function"
          DEST="$GITHUB_WORKSPACE/tools/uac2-kmod"
          # 复制主源文件。4.4 只有 f_uac2.c（**自包含**，只 include u_uac2.h）；
          # u_audio.c 是 4.6+ 才从 f_uac2.c 抽出的 ALSA 公共层，4.4 里不存在，
          # 所以这里用循环试探而非硬列，避免 cp 某个不存在的文件直接崩。
          for f in f_uac2.c u_audio.c; do
            if [ -f "$FN/$f" ]; then cp -v "$FN/$f" "$DEST/"; else echo "(skip) $f 在本内核版本中不存在"; fi
          done
          # 自动解析并复制本地引号头（含二级依赖），避免手工遗漏
          for pass in 1 2 3; do
            for h in $(grep -ho '^#include "[^"]*"' "$DEST"/*.c "$DEST"/*.h 2>/dev/null \
                       | sed 's/.*"\(.*\)"/\1/' | sort -u); do
              [ -f "$DEST/$h" ] && continue
              if   [ -f "$FN/$h" ];                then cp -v "$FN/$h" "$DEST/"
              elif [ -f "linux-${KVER}/drivers/usb/gadget/$h" ]; then cp -v "linux-${KVER}/drivers/usb/gadget/$h" "$DEST/"
              fi
            done
          done
          echo "=== 模块目录最终内容 ==="
          ls -la "$DEST"

      - name: 编译 utest.ko（空模块探针，验证整条工具链）
        run: |
          cd "$GITHUB_WORKSPACE"
          make -C "linux-${KVER}" M="$PWD/tools/uac2-kmod" \
            ARCH=arm64 CROSS_COMPILE="${CROSS}" modules
          ls -la tools/uac2-kmod/*.ko

      - name: 编译 usb_uac2.ko（真实 UAC2 gadget 模块）
        id: build-uac2
        continue-on-error: true
        run: |
          cd "$GITHUB_WORKSPACE"
          # 依据实际复制到的源文件组装目标文件列表（4.4 只会是 f_uac2.o）
          OBJS=""
          for f in f_uac2.c u_audio.c; do
            [ -f "tools/uac2-kmod/$f" ] && OBJS="$OBJS ${f%.c}.o"
          done
          OBJS="${OBJS# }"
          echo "UAC2_OBJS = [$OBJS]"
          make -C "linux-${KVER}" M="$PWD/tools/uac2-kmod" \
            ARCH=arm64 CROSS_COMPILE="${CROSS}" WITH_UAC2=1 UAC2_OBJS="$OBJS" modules
          ls -la tools/uac2-kmod/*.ko

      - name: ABI 修正 —— 把 this_module 的两条重定位搬到设备内核的字段偏移
        run: |
          cd "$GITHUB_WORKSPACE"
          # 目标偏移的来源分两级，保证「可追溯」同时「CI 里自足」：
          #
          #   ① 若本机放有厂商参考模块（PENMODS_ABI_REF 或 kmod-out/vendor/*.ko），
          #      就**现取**偏移 —— 判据永远和设备一致。这是首选。
          #   ② 否则读仓库里提交的 tools/uac2-kmod/ref-abi.txt —— 一份只有 5 个
          #      数字的基准文件，里面写清了这两份厂商模块的路径与 md5，
          #      任何人都能拿设备上的 .ko 复核。
          #      ⚠️ 不把 2MB+ 的厂商二进制塞进仓库（体积 + 授权都不合适）。
          #   两条路都必须与 layout-patch.py 内置的实测默认值**对账**，
          #   任何一侧漂移就硬失败 —— 不允许静默用错偏移。
          REF="${PENMODS_ABI_REF:-}"
          if [ -z "$REF" ]; then
            for c in kmod-out/vendor/hci_uart.ko kmod-out/vendor/8723ds.ko; do
              [ -f "$c" ] && REF="$c" && break
            done
          fi
          python3 - "$REF" <<'PYABI'
          import importlib.util, re, sys
          ref_ko = sys.argv[1] if len(sys.argv) > 1 else ''
          spec = importlib.util.spec_from_file_location('lp', 'tools/uac2-kmod/layout-patch.py')
          lp = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(lp)
          builtin = {'size': lp.DEF_SIZE, 'name': lp.DEF_NAME_OFF,
                     'init': lp.DEF_INIT, 'exit': lp.DEF_EXIT}

          if ref_ko:
              kl = lp.KL
              d, shs = kl.load(ref_ko)
              syms = kl.symbols(d, shs)
              tm = rela = None
              for sh in shs:
                  if sh['sname'] == '.gnu.linkonce.this_module':
                      tm = sh
                  if sh['sname'] == '.rela.gnu.linkonce.this_module':
                      rela = sh
              if tm is None or rela is None:
                  sys.exit('❌ 参考模块 %s 里没有 this_module 节/重定位' % ref_ko)
              got = {'size': tm['size']}
              for r_offset, sidx, _ in kl.relocs(d, shs, rela):
                  nm = syms[sidx][0]
                  if nm == 'init_module':
                      got['init'] = r_offset
                  elif nm == 'cleanup_module':
                      got['exit'] = r_offset
              # 名字偏移直接扫
              body = kl.section_bytes(d, tm)
              for i in range(min(len(body), 256)):
                  j = body.find(b'\0', i)
                  if j < 0:
                      break
                  seg = body[i:j]
                  if 2 <= len(seg) <= 56 and all(32 <= c < 127 for c in seg):
                      got['name'] = i
                      break
              src = '厂商参考模块 %s' % ref_ko
          else:
              txt = open('tools/uac2-kmod/ref-abi.txt', encoding='utf-8').read()
              got = {k: int(v) for k, v in
                     re.findall(r'^(size|align|name|init|exit)\s*=\s*(\d+)', txt, re.M)}
              src = 'tools/uac2-kmod/ref-abi.txt'

          print('基准来源:', src)
          print('  基准值  :', got)
          print('  工具内置:', builtin)
          bad = [k for k, v in builtin.items() if got.get(k) != v]
          if bad:
              sys.exit('❌ 基准漂移: %s —— 基准(%s) 与 layout-patch.py 内置值(%s) 不一致，终止'
                       % (', '.join(bad), got, builtin))
          if got.get('align') not in (None, 64):
              sys.exit('❌ align 基准应为 64（L1_CACHE_BYTES=64），实为 %s' % got.get('align'))
          print('✅ 基准自洽（size=%d name=%d init=%d exit=%d align=64）'
                % (got['size'], got['name'], got['init'], got['exit']))
          PYABI

          rc=0
          for k in tools/uac2-kmod/*.ko; do
            [ -e "$k" ] || continue
            if [ -n "$REF" ]; then
              python3 tools/uac2-kmod/layout-patch.py "$k" --ref "$REF" || rc=1
            else
              python3 tools/uac2-kmod/layout-patch.py "$k" || rc=1
            fi
          done
          if [ "$rc" != 0 ]; then
            echo "❌ ABI 修正失败 —— 产物不可用，终止（不要让下载到错布局的 .ko）"
            exit 1
          fi
          echo "✅ 全部 .ko 的 this_module 布局已对齐设备内核"

      - name: 静态校验产物（vermagic / 未决符号 / 段信息）
        run: |
          cd "$GITHUB_WORKSPACE/tools/uac2-kmod"
          OUT="$GITHUB_WORKSPACE/kmod-report.txt"
          : > "$OUT"
          FAIL=0
          for k in *.ko; do
            [ -e "$k" ] || continue
            {
              echo "############ $k ############"
              echo "--- 文件大小 ---"; ls -la "$k"
              echo "--- vermagic（必须 = 4.4.159 SMP mod_unload aarch64）---"
              vm=$(strings "$k" | grep -E '^vermagic=' | sort -u | head -1)
              echo "  $vm"
              if [ "$vm" != "vermagic=${KVER} SMP mod_unload aarch64" ]; then
                echo "  ❌ vermagic 必须是 'vermagic=${KVER} SMP mod_unload aarch64'（多一个 preempt 都会 insmod 失败）"
                FAIL=1
              else
                echo "  ✅ vermagic 逐字匹配"
              fi
              echo "--- 模块元信息 ---"
              strings "$k" | grep -E '^(name|license|description|author)=' | sort -u
              echo "--- this_module 布局（设备实测：size=704 align=64 init=368 exit=680）---"
              # ⚠️ 不能用 awk 的 strtonum —— ubuntu runner 上的 awk 是 mawk，没有这个函数。
              #    改成 shell 的 16# 基数算术。
              line=$(aarch64-linux-gnu-objdump -h "$k" | awk '/gnu.linkonce.this_module/ {print; exit}')
              hx=$(echo "$line" | awk '{print $3}')
              alg=$(echo "$line" | awk '{print $NF}')
              if [ -n "$hx" ]; then
                dec=$((16#$hx))
                if [ "$dec" -eq 704 ] && [ "$alg" = "2**6" ]; then
                  echo "  ✅ size=$dec（=704）align=$alg（=64）—— 与原厂 .ko 逐字一致"
                else
                  echo "  ❌ size=$dec（期望 704）align=$alg（期望 2**6）"
                  echo "     ⇒ L1_CACHE_BYTES 或 struct module 成员没对齐"
                  FAIL=1
                fi
              else
                echo "  ❌ 未找到 .gnu.linkonce.this_module 节"
                FAIL=1
              fi
              echo "--- ABI 指纹（设备实测：init=368 exit=680，必须一致）---"
              fpout=$(python3 "$GITHUB_WORKSPACE/tools/uac2-kmod/kmod-layout.py" --fingerprint "$k" 2>/dev/null)
              echo "  $fpout"
              finit=$(echo "$fpout" | sed -n 's/.*init=\([0-9]*\).*/\1/p')
              fexit=$(echo "$fpout" | sed -n 's/.*exit=\([0-9]*\).*/\1/p')
              if [ "$finit" = "368" ] && [ "$fexit" = "680" ]; then
                echo "  ✅ init/exit 偏移与设备内核一致"
              else
                echo "  ❌ init=$finit exit=$fexit —— 设备要求 init=368 exit=680，模块无法被正确 init/exit"
                FAIL=1
              fi
              echo "--- 未决符号（需由内核提供，应与设备 kallsyms 对得上）---"
              aarch64-linux-gnu-nm -u "$k" | awk '{print $NF}' | sort -u
              echo "--- 本模块导出的符号 ---"
              aarch64-linux-gnu-nm --defined-only "$k" | grep -E ' [TtDdBbRr] ' | head -40 || true
              echo
            } >> "$OUT"
            echo "=== $k ==="; strings "$k" | grep -E '^vermagic=' | sort -u
          done
          cat "$OUT"
          if [ "$FAIL" != 0 ]; then
            echo "❌ 静态校验未通过（见上面的 ❌ 行）"
            exit 1
          fi
          echo "✅ 静态校验全部通过"

      - name: 上传内核模块产物
        uses: actions/upload-artifact@v4
        with:
          name: penmods-uac2-kmod-${{ env.KVER }}-${{ github.sha }}
          path: |
            tools/uac2-kmod/*.ko
            kmod-report.txt
          if-no-files-found: error
          retention-days: 7

      # ─────────────────────────────────────────────────────────────────────
      # 结构体尺寸指纹
      # ─────────────────────────────────────────────────────────────────────
      # 为什么需要：`struct module` 只是**一个** ABI。`usb_uac2.ko` 是**真驱动**，
      # 会碰 ALSA/USB 那一大票**内含 spinlock_t / struct mutex 的内核结构体**
      # （snd_card、snd_pcm_runtime、usb_gadget…）。这些结构体里任何一个成员
      # 尺寸不对，整块内存的字段偏移就全错 ⇒ 我们按自己的偏移读写、内核按它的
      # 偏移管理 = 真会搞坏内核。所以必须把「配置一致性」变成一个可测量的事实，
      # 而不是"看起来差不多"。
      #
      # 判据从哪来：设备 `/proc/slabinfo` 的 objsize 就是内核自己调用
      # `kmem_cache_create(name, sizeof(struct X), ...)` 的实参 —— ground truth。
      # 这里把同一批 `sizeof()` 编出来打一份，两边一比即可。
      - name: 结构体尺寸指纹（与设备 /proc/slabinfo 的 objsize 对照）
        run: |
          cd "$GITHUB_WORKSPACE"
          make -C "linux-${KVER}" M="$PWD/tools/uac2-kmod/sizeprobe" \
            ARCH=arm64 CROSS_COMPILE="${CROSS}" modules
          echo "=========== 结构体尺寸指纹（nm -S 的 size 列 = sizeof）==========="
          aarch64-linux-gnu-nm -S --defined-only \
            tools/uac2-kmod/sizeprobe/sizeprobe.ko \
            | awk '$3 ~ /^[BbDdRr]$/ {print $2, $4}' | sort -k2
          echo "=========== 影响这些尺寸的关键配置 ==========="
          grep -E '^CONFIG_(DEBUG_KERNEL|DEBUG_SPINLOCK|DEBUG_MUTEXES|DEBUG_LOCK_ALLOC|LOCKDEP|SMP|SYSFS|KALLSYMS|GENERIC_BUG|MODULES_TREE_LOOKUP|MODULE_UNLOAD|TRACEPOINTS|JUMP_LABEL|SND|SND_PCM|USB_GADGET)=' \
            "linux-${KVER}/.config" | sort
