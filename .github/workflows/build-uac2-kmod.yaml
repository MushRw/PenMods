name: Build UAC2 Kernel Module

# 为什么需要这个 workflow
# ------------------------
# 目标：让词典笔通过 USB 被电脑识别成「免驱音频设备」（电脑端零安装）。
# 电脑端零安装的 USB 音频只有一条标准路径：USB Audio Class（UAC）。
#
# 但设备内核实测缺两样东西：
#   1) configfs 建不出 uac2.0 —— 内核没编 f_uac2 / u_audio
#      （用原厂脚本的真实实例名 uac1.gs0/uac2.gs0/uac1.0/audio.0 复测，全部 ENOENT）
#   2) FunctionFS 也写不出 UAC 描述符 —— 4.4 的 f_fs.c 里 ffs_do_single_desc()
#      对 bDescriptorType 是精确 switch，只认 INTERFACE(0x04)/ENDPOINT(0x05)/
#      HID_DT_HID(0x21)/OTG(0x09)/IASSOC(0x0B)/SS_EP_COMP(0x30)，其余落 default
#      直接 -EINVAL。UAC 必需的 CS_INTERFACE(0x24)/CS_ENDPOINT(0x25) 必然被拒。
#      （实测：0x21 能过不是「透传」，而是它恰好等于 HID_DT_HID）
#
# 唯一的出路：自己编 f_uac2.ko + u_audio.ko 加载进内核。实测这三条同时成立：
#   * CONFIG_MODULES=y      —— /proc/modules 里真跑着 hci_uart / 8723ds
#   * CONFIG_MODVERSIONS=n  —— 现有 .ko 里 __crc_ 符号数 = 0
#                              ⇒ 不需要 Module.symvers，**不必编译整个内核**
#   * 模块未签名、modules_disabled=0
#   * vermagic = 4.4.159 SMP mod_unload aarch64（精确版本已知）
#   * f_uac2 依赖的 gadget 核心符号（usb_add_function / usb_ep_autoconfig /
#     config_ep_by_speed ...）与 ALSA 符号在设备 kallsyms 中全部存在
#
# 因为 vermagic 里的版本号必须严格是 4.4.159，而 4.4.159 恰好是上游正式发布版，
# 直接取 kernel.org 的源码即可拿到天然匹配的 vermagic，无需手工篡改。
#
# ⚠️ 本 workflow 只负责「编译 + 静态校验」，**不接触设备**。
#    加载与验证在本地用 adb 分台阶做（见 tools/uac2-kmod/ 注释）。

on:
  # 本文件所在的专线是 topic/uac2-kmod（不是默认分支 main），因此
  # workflow_dispatch 端点不会注册（它只对「默认分支上存在的 workflow」注册，
  # 直接 dispatch 会 404）。主入口走 push：改动模块源码或本文件即自动重编，
  # 这样每一轮 ABI 迭代都能自动出产物，不必依赖手工触发。
  push:
    paths:
      - 'tools/uac2-kmod/**'
      - '.github/workflows/build-uac2-kmod.yaml'
  workflow_dispatch:
    inputs:
      kernel_version:
        description: '目标内核版本（必须与设备 vermagic 一致，当前 = 4.4.159）'
        required: true
        default: '4.4.159'

env:
  KVER: ${{ github.event.inputs.kernel_version || '4.4.159' }}
  CROSS: aarch64-linux-gnu-

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: 安装构建依赖
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            build-essential bc flex bison libssl-dev libelf-dev \
            wget xz-utils gcc-aarch64-linux-gnu
          # 用系统 GCC 11 编 host 工具（modpost/fixdep）。
          # 不用 archlinux:latest 是因为它的 GCC 14+ 会把
          # implicit-function-declaration 升级成 error，编不过 4.4 的老脚本。
          aarch64-linux-gnu-gcc --version | head -1
          gcc --version | head -1

      - name: 检出代码
        uses: actions/checkout@v4

      - name: 缓存内核源码包
        id: cache-ksrc
        uses: actions/cache@v4
        with:
          path: linux-${{ env.KVER }}.tar.xz
          key: linux-src-tar-${{ env.KVER }}

      - name: 下载内核源码
        if: steps.cache-ksrc.outputs.cache-hit != 'true'
        run: |
          wget -q "https://cdn.kernel.org/pub/linux/kernel/v4.x/linux-${KVER}.tar.xz"
          ls -la "linux-${KVER}.tar.xz"

      - name: 解压内核源码
        run: |
          tar xf "linux-${KVER}.tar.xz"
          ls -d "linux-${KVER}"
          head -5 "linux-${KVER}/Makefile"

      - name: 配置内核并准备模块头文件
        run: |
          cd "linux-${KVER}"
          make ARCH=arm64 CROSS_COMPILE="${CROSS}" defconfig
          # 关掉会引入 libssl 3.x 不兼容的签名相关项（省掉 extract-cert 编译坑）
          ./scripts/config \
            --disable MODULE_SIG --disable MODULE_SIG_ALL \
            --disable SYSTEM_TRUSTED_KEYRING --disable SYSTEM_REVOCATION_KEYS \
            --disable MODULE_SIG_FORCE || true
          # 打开 UAC2 / ALSA 依赖，让 f_uac2.c 能拿到完整的 sound / gadget 头文件
          # （4.4 的实际开关名是 USB_F_UAC2，由 USB_CONFIGFS_F_UAC2 select）
          #
          # ★★★ 第六处 ABI 差异（2026-10-03 定位，真机 oops 的真根因）★★★
          #
          # ⚠️ 这里原来**少了一行 `--enable SOUND`**，于是下面这整段 `--enable SND`
          #    从第一轮 CI 起就一直是**静默 no-op**：
          #      · arm64 4.4 的 defconfig 一共只有 227 行，里面**一个 sound/audio/snd
          #        配置项都没有**（已核实上游 v4.4 原文）；
          #      · `config SND` 在 4.4 的 sound/Kconfig 里是 `depends on SOUND`，
          #        而 SOUND 从未打开 ⇒ `make olddefconfig` 会把 `CONFIG_SND=y`
          #        重新解析回 n。
          #    后果不是"编不过"，而是**编出来的结构体布局和内核不一致**：
          #
          #      `struct snd_pcm_str` 尾部有两个只在 CONFIG_SND_VERBOSE_PROCFS
          #      （bool，`default y`，SND 一开就自动 y）下存在的指针：
          #          struct snd_info_entry *proc_root;
          #          struct snd_info_entry *proc_info_entry;
          #      它们位于 `struct snd_pcm` 的 `streams[2]` 内部，**即 private_data
          #      之前** ⇒ 我们算出的 offsetof(snd_pcm, private_data) 比内核**小 32**
          #      字节（2 × 16）。
          #
          # 真机表现（2026-10-03 11:51，aplay 打开 PCM 时）：
          #      PC is at uac2_pcm_open+0x20/0x190 [usb_uac2]
          #      30d8  f9400816   ldr  x22, [x0, #16]     ; substream->private_data
          #      30e0  f85f02c1   ldur x1,  [x22, #-16]   ; ← 崩，x22 = 0
          # 即 `alsa_uac2_init()` 里那句 `pcm->private_data = uac2;` 写到了内核
          # `struct snd_pcm` 的**别的字段**上（低 32 字节 ⇒ 落在 open_wait 尾部），
          # 内核在真偏移处读到 kzalloc 出来的 0，拷给 substream ⇒ 解引用 NULL。
          # ⚠️ 这同时是一次**写坏内核结构体**：同一个错位也让 `pcm->private_free`
          #    偏移错，内核 free 时会跳进我们写的 uac2 指针 ⇒ 一样是 oops。
          #
          # 设备侧独立证据（两条，与上面的推理互不依赖）：
          #   · `/proc/asound/` 里有 `Loopback` 目录、`card0/pcm0p/sub0/info` 层级
          #     ⇒ 设备的 **CONFIG_SND_VERBOSE_PROCFS = y**（verbose procfs 才建这些）
          #   · 同一目录下**没有 `oss`** ⇒ 设备 CONFIG_SND_PCM_OSS = n
          # 所以修法有两半：**开 SOUND**（让 SND 真的生效）+ **关 OSS**（与设备一致）。
          ./scripts/config \
            --enable SOUND --enable SND --enable SND_PCM --enable SND_PCM_ELD \
            --disable SND_PCM_OSS --disable SND_SEQUENCER_OSS \
            --disable SND_DEBUG --disable SND_PCM_XRUN_DEBUG \
            --enable USB_GADGET --enable USB_LIBCOMPOSITE \
            --enable USB_CONFIGFS --enable USB_CONFIGFS_F_UAC2 || true
          # ⚠️ 必须关掉 PREEMPT：上游 arm64 defconfig 开着 CONFIG_PREEMPT，编出来的
          #    vermagic 是 "4.4.159 SMP preempt mod_unload aarch64"，而设备实测是
          #    "4.4.159 SMP mod_unload aarch64"（无 preempt）。差一个词就 insmod 不了
          #    （invalid module format），而且 PREEMPT 本身也会影响部分结构体布局。
          ./scripts/config \
            --disable PREEMPT --disable PREEMPT_VOLUNTARY \
            --enable PREEMPT_NONE --disable PREEMPT_COUNT || true
          # ★★ 关掉 tracing 家族
          #
          # 实测证据：原厂 hci_uart.ko / 8723ds.ko 的 .gnu.linkonce.this_module
          # 节大小都是 704，而用上游 arm64 defconfig 编出来的是 768 —— 差 64 字节。
          # 后果：内核按**它自己的**偏移往这块内存里读写字段，我们读的是**我们的**
          # 偏移 ⇒ /proc/modules 里 refcount 打出 9400318 这种垃圾值（其实是
          # module_core 基址 0x8F7000 附近），rmmod 报 EAGAIN
          # ("Resource temporarily unavailable")。
          #
          # 判据是设备 /proc/kallsyms 里的函数符号（数据符号列不全，但够用）：
          #   | 判据（kallsyms 里的符号）        | 设备 | 结论                        |
          #   | static_key*/jump_label* 计数     |  0   | CONFIG_JUMP_LABEL=n         |
          #   | *ftrace* 计数 / /sys/kernel/tracing | 0 / 无 | FTRACE/TRACING/TRACEPOINTS |
          #   |                                  |      | /EVENT_TRACING 全 = n       |
          #   | klp_enable_patch                 |  无  | CONFIG_LIVEPATCH=n          |
          #   | mod_verify_sig                   |  无  | CONFIG_MODULE_SIG=n         |
          #   | module_refcount/try_module_get   | 有   | CONFIG_MODULE_UNLOAD=y      |
          #   | kallsyms_lookup_name             | 有   | CONFIG_KALLSYMS=y（ALL=n）  |
          # ⇒ 设备把整个 tracing 子系统砍了，而那正好是 struct module 里
          #   TRACEPOINTS / HAVE_JUMP_LABEL / TRACING / EVENT_TRACING /
          #   FTRACE_MCOUNT_RECORD 这 5 个 #ifdef 块。
          # 另外用户栈顶 0x7ff4039000 紧贴 0x8000000000 ⇒ VA_BITS=39（上游是 48），
          # 一并还原以求配置忠实（这一项不改变 struct module 大小）。
          ./scripts/config \
            --disable FTRACE --disable FUNCTION_TRACER --disable DYNAMIC_FTRACE \
            --disable FTRACE_MCOUNT_RECORD --disable STACK_TRACER \
            --disable FUNCTION_GRAPH_TRACER --disable TRACING \
            --disable TRACEPOINTS --disable EVENT_TRACING \
            --disable TRACEPOINT_BENCHMARK --disable TRACER_SNAPSHOT \
            --disable LIVEPATCH --disable JUMP_LABEL \
            --disable KALLSYMS_ALL --disable DEBUG_INFO --disable DEBUG_INFO_DWARF4 \
            --disable ARM64_VA_BITS_48 --enable ARM64_VA_BITS_39 \
            || true
          # ★★ 必须打开 CONFIG_DEBUG_SPINLOCK —— 厂商内核就是开的 ★★
          #
          # raw_spinlock_t 在 DEBUG_SPINLOCK=y 时从 4 字节变 24 字节
          # （多 magic / owner_cpu / owner），于是：
          #     spinlock_t          4 → 24
          #     struct mutex       40 → 64
          #     struct semaphore   24 → 48
          # 这不是"猜"：三份互相独立的实测证据全部指向同一个结论 ——
          #   A) 厂商 8723ds.ko 的 .bss 里
          #        GLBtcBtMpOperLock（realtek 的 `_lock` = struct mutex）size = 64
          #        wifi_control_sem / GLBtcBtMpRptSema（`_sema` = struct semaphore）size = 48
          #      —— DEBUG_SPINLOCK=n 时这两个只可能是 40 / 24。
          #   B) 厂商 .ko 的 struct module offsetof(init) = 368；本工作流的配置矩阵
          #      实测只有 `+DEBUG_SPINLOCK` 能把我们的 344 顶到 368（因为 struct
          #      module 里正好有 `#ifdef CONFIG_SYSFS struct mutex param_lock;`）。
          #   C) 上面两个尺寸与 A) 完全自洽（mutex 64 - semaphore 48 = 16，两种
          #      配置下差值都是 16，所以 64/48 这一对只能来自 DEBUG_SPINLOCK）。
          #
          # ⚠️ 为什么这条对本项目是**安全红线**而不是锦上添花：
          #   snd_card / snd_pcm_runtime / snd_pcm_substream / usb_gadget 这些
          #   结构体内部都有 spinlock_t / struct mutex。偏移一错，usb_uac2.ko 就会
          #   读写内核结构体的错误字段 —— 那是真的会搞坏内核，而不是"加载失败而已"。
          # ★★★ 必须打开 CONFIG_TIMER_STATS —— 厂商内核就是开的 ★★★
          #
          # 这是**第七处 ABI 差异**（2026-10-03 定位，第二次真机 oops 的真根因）。
          #
          # 四方互相独立的实测证据（全部来自设备，只读）：
          #   A) `/proc/timer_stats` 存在，内容为
          #        Timer Stats Version: v0.3
          #        Sample period: 0.000 s
          #        Collection: inactive
          #   B) /proc/kallsyms 里这四个**静态**符号都在：
          #        tstats_open / tstats_show / tstats_write / init_tstats_procfs
          #   C) 它们只可能来自 kernel/time/timer_stats.c，而
          #        kernel/time/Makefile:12  obj-$(CONFIG_TIMER_STATS) += timer_stats.o
          #      ⇒ 该文件被编进内核 ⇒ CONFIG_TIMER_STATS=y
          #   D) lib/Kconfig.debug:896 `config TIMER_STATS` 的 help 原文：
          #        "The statistics can be read from /proc/timer_stats"
          #      —— 与 A) 的实测逐字吻合。
          #
          # ★ 为什么这一条对本项目是**安全红线**而不是锦上添花：
          #   struct timer_list（include/linux/timer.h）尾部挂着
          #       #ifdef CONFIG_TIMER_STATS
          #           int  start_pid;      // 4 (+4 pad)
          #           void *start_site;    // 8
          #           char start_comm[16]; // 16      ⇒ 共 +32 字节
          #   而这条 +32 会顺着
          #       timer_list → delayed_work (+32) → pm_qos_request (+32)
          #   传下去，`struct snd_pcm_substream` 里正好内嵌一个
          #       struct pm_qos_request latency_pm_qos_req;   // @64
          #   于是：
          #       sizeof(struct pm_qos_request)          144 → 176
          #       offsetof(snd_pcm_substream, runtime)   280 → 312
          #   后果：内核按**它的** 312 写 substream->runtime（snd_pcm_attach_substream
          #   里 `substream->runtime = runtime;`），我们按**我们的** 280 去读 ⇒
          #   读到的正好落在 latency_pm_qos_req 内部、是 kzalloc 出来的 0。
          #   真机表现（2026-10-03 12:16，aplay -D hw:1,0）：
          #       PC is at uac2_pcm_open+0x40/0x190 [usb_uac2]
          #       Unable to handle kernel NULL pointer dereference at virtual address 00000180
          #       x21: 0000000000000000      ← runtime
          #   反汇编我们自己编出来的 .ko 逐条对上（llvm-objdump，函数入口 0x10c0）：
          #       10e8: f9408c15   ldr x21, [x0, #0x118]      ; 0x118 = 280 ← 我们的偏移
          #       1100: a91816a4   stp x4, x5, [x21, #0x180] ; runtime->hw = ... ← 崩在这
          #   （0x1100 - 0x10c0 = 0x40 与 oops 的 PC 偏移一致；fault 地址 0x180 也一致。
          #     另一半 `ldur x1,[x22,#-16]` 上一轮已修好，这次没再崩。）
          #
          # ⚠️ 注意它同时**改变 struct device**：`struct device` 内嵌
          #    `struct dev_pm_info power`，而 dev_pm_info 在 `#ifdef CONFIG_PM` 里有
          #    `struct timer_list suspend_timer;`。所以打开 TIMER_STATS 会给
          #    struct device 也加 32 字节 —— 这正是下一步要同时关掉 MSI 的原因，
          #    两处的组合详见下一个 ABI 段落（第五处）的注释。
          ./scripts/config --enable DEBUG_KERNEL --enable DEBUG_SPINLOCK || true
          ./scripts/config --enable TIMER_STATS || true
          make ARCH=arm64 CROSS_COMPILE="${CROSS}" olddefconfig
          # ★★★ 第五处 ABI 复刻：struct device 在 of_node 之前的成员要逐项对准 ★★★
          #
          # 实测（2026-09-27 真机 oops + abiprobe 读内核机器码）：
          #   afunc_bind → platform_device_register → device_add → sysfs_create_groups
          #   → internal_create_group 处 "Unable to handle kernel paging request"
          # 即 offsetof(struct device, groups) 两边不一致。abiprobe 从内核自己的
          # device_add 机器码里读出（x19 = dev）：
          #     [x19,#88]  = dev->type    （我们 88  ✅ 一致）
          #     [x19,#752] = dev->class
          #     [x19,#760] = dev->groups
          #     [x19,#768] = dev->release
          #
          # struct device 里受 Kconfig 影响的成员一共只有 5 个，**全部位于 of_node 之前**：
          #     CONFIG_GENERIC_MSI_IRQ_DOMAIN  struct irq_domain *msi_domain  +8
          #     CONFIG_PINCTRL                 struct dev_pin_info *pins     +8
          #     CONFIG_GENERIC_MSI_IRQ         struct list_head msi_list     +16
          #     CONFIG_NUMA                    int numa_node                 +4
          #     CONFIG_DMA_CMA                 struct cma *cma_area          +8
          # 另加 dev_archdata（CONFIG_IOMMU_API 决定它是 16 还是 24 字节）。
          #
          # ★ 2026-09-27 第一次修正：上一版按 /proc/kallsyms 反推，把
          #   DMA_CMA / NUMA / MSI 全关 —— **方向反了**，上机后 class 从 744 掉到 712。
          #   踩的坑：未开 KALLSYMS_ALL 时 kallsyms 只列函数，数据符号缺失是
          #   **假阴性**，不能当作"该功能没编进内核"的证据。
          # ★ 2026-10-03 第三次修正（现行结论）：那个"拿不到的厂商私有 +8 字节"
          #   **不存在**。第一次修正把 DMA_CMA / NUMA / MSI 全关（方向反了）；
          #   第二次把 PINCTRL(+8) 与 DMA_CMA(-8) 一起放开后**仍然**差 8，就误判成
          #   "厂商私有改动"，用 8 字节占位糊了过去。真因是两处错误相抵剩下的零头：
          #       我们多开 MSI                        = msi_list(16)+msi_domain(8) = +24
          #       设备多开 TIMER_STATS（dev_pm_info
          #         里的 struct timer_list）          = −32
          #       ---------------------------------------------------------------
          #       净差                                  = −8  ⇒ 占位恰好是 +8
          #   （两条证据链分别见上面 TIMER_STATS 那一段、下面 MSI 那一段。）
          #   ⇒ MSI 已改成 --disable，device.h 的 8 字节占位补丁已**整个删除**。
          #
          #   ⚠️ 下面这几行配置**仍然必需**：`of_node` 之前必须逐字节精确，
          #   任何一项错都会让 class / groups / release 一起错回 oops。
          #   现在不再靠"占位"兜底，而是靠下面那组硬断言 + CI 里的尺寸指纹。
          #
          # 设备侧硬事实（全部为只读探测；"文本符号"只对**函数**有效）：
          #     cma_alloc / dma_alloc_from_contiguous 不存在  ⇒ CONFIG_DMA_CMA = n
          #         （注意：把关 struct device 里 cma_area 的是 DMA_CMA，不是 CMA）
          #     /sys/devices/system/node 不存在                ⇒ CONFIG_NUMA = n
          #     pinctrl_register / devm_pinctrl_get 都在      ⇒ CONFIG_PINCTRL = y
          #     /sys/class/iommu 存在                          ⇒ CONFIG_IOMMU_API = y
          #     /sys/bus/pci 不存在                            ⇒ CONFIG_PCI = n
          #
          # 目标不是"猜 Kconfig"，而是让 sizeof(struct device) 与内核逐字节相等：
          #     dev->type=88（一致）、class=752、groups=760、release=768
          # 复验方法：编出 abiprobe.ko → insmod → 比对它打印的 ours 成员表与内核
          # 机器码表；**只有完全一致才可以去绑 UDC**（设备 panic_on_oops=1）。
          ./scripts/config --enable IOMMU_SUPPORT --enable IOMMU_API || true
          # ★ 2026-10-03 第三次修正：MSI 必须**关**（原来写的是 --enable，方向反了）★
          #
          # 之前我们把 GENERIC_MSI_IRQ / GENERIC_MSI_IRQ_DOMAIN 打开，理由是"排不掉"，
          # 然后在 device.h 里补了 8 字节占位把 class/groups/release 顶回 752/760/768。
          # 现在真因已经查清 —— **那个"拿不到的厂商私有 +8 字节"根本不存在**，
          # 它是两处错误相抵剩下的零头：
          #     我们多开 MSI                        = msi_list(16) + msi_domain(8) = +24
          #     设备多开 TIMER_STATS（dev_pm_info
          #       里的 struct timer_list）          = −32
          #     --------------------------------------------------------------
          #     净差                                  = −8 ⇒ 所以占位恰好是 +8
          #
          # 设备侧判据（2026-10-03 实测，全部只读）：
          #     /sys/devices/platform/*/msi_irqs  一个都没有（count = 0）
          #     /sys/bus/pci 不存在                ⇒ CONFIG_PCI = n
          #     kallsyms 里 msi_domain_alloc_irqs / msi_create_irq_domain 全无
          #   ⇒ 没有 PCIe 的 SoC 不会开 MSI。（`of_msi_configure` 在 kallsyms 里有，
          #     但它是**假证据**：drivers/of/irq.c 里该函数没有任何 MSI 守卫，
          #     它调用的 dev_set_msi_domain() 是 device.h 里的 static inline，
          #     MSI_DOMAIN=n 时退化成空操作 ⇒ 该符号恒存在。）
          #
          # 关掉 MSI(−24) 之后，CONFIG_TIMER_STATS(+32) 正好把 sizeof(struct device)
          # 重新顶回 792，class/groups/release 回到 752/760/768 ⇒ **device.h 的
          # 8 字节占位补丁可以整个删掉**（见下面 "ABI 补丁已删除" 那一段）。
          #
          # ★ 2026-10-03 第四次修正：MSI 的关闭必须**溯源到 select 者** ★
          #
          # 上一版写的是
          #     ./scripts/config --disable GENERIC_MSI_IRQ --disable GENERIC_MSI_IRQ_DOMAIN
          # CI run 37097119107 证明它是**两行空操作**：
          #     CONFIG_GENERIC_MSI_IRQ=y
          #     CONFIG_GENERIC_MSI_IRQ_DOMAIN=y
          # 原因：这两个符号在 kernel/irq/Kconfig:68 / :72 里都是
          #     config GENERIC_MSI_IRQ
          #         bool                      ← 只有类型，**没有 prompt 提示串**
          # ⇒ 它们对用户不可见，只能被 select，`scripts/config --disable` 改不动。
          #
          # select 链（4.4 原文，已逐行核对）：
          #   arch/arm64/Kconfig:190  config PCI    bool "PCI support"（**无 default**）
          #   drivers/pci/Kconfig:8   config PCI_MSI             depends on PCI
          #                                                     select GENERIC_MSI_IRQ
          #   drivers/pci/Kconfig:24  config PCI_MSI_IRQ_DOMAIN  depends on PCI_MSI
          #                                                     select GENERIC_MSI_IRQ_DOMAIN
          #   kernel/irq/Kconfig:75   GENERIC_MSI_IRQ_DOMAIN     select GENERIC_MSI_IRQ
          #   arch/arm64/Kconfig:20   select ARM_GIC_V2M     if PCI_MSI
          #   arch/arm64/Kconfig:22   select ARM_GIC_V3_ITS  if PCI_MSI
          # 全树 `select GENERIC_MSI_IRQ` 只有上面那两处、`select GENERIC_MSI_IRQ_DOMAIN`
          # 只有一处（已对 kernel/irq、drivers/pci、drivers/irqchip、arch/arm64 四个
          # Kconfig 逐条 grep 确认），**没有别的 select 路径**；而 `config PCI` 无 default、
          # 也没有任何 `select PCI` ⇒ 显式关掉 PCI 之后：
          #     PCI_MSI（depends on PCI）            → 关
          #     PCI_MSI_IRQ_DOMAIN（depends on PCI_MSI）→ 关
          #     ARM_GIC_V2M / ARM_GIC_V3_ITS（if PCI_MSI）→ 关
          #     GENERIC_MSI_IRQ(_DOMAIN)             → 不再被任何人 select ⇒ 关
          # 设备侧判据：`/sys/bus/pci` 不存在、`/sys/devices/platform/*/msi_irqs` 内容为空
          # ⇒ 设备内核 MSI=n。关掉后 struct device 少 msi_list(16)+msi_domain(8)=24 字节。
          # ⚠️ 不要直接写 --disable GENERIC_MSI_IRQ*（空操作），必须走 PCI 这条路。
          ./scripts/config --disable PCI || true
          ./scripts/config --disable PCI_MSI || true
          ./scripts/config --disable PCI_MSI_IRQ_DOMAIN || true
          # ⚠️ NUMA 必须显式关掉（原来这里写的是 --enable NUMA，那是个**静默 no-op**：
          #    arm64 4.4 的 `config NUMA` 依赖 OF_NUMA，enable 了也不会生效，
          #    于是"按 Kconfig 逐项折算凑出 class=752"的错觉正是被它骗出来的）。
          #    设备侧证据：/sys/devices/system/node 不存在 ⇒ 内核 NUMA=n。
          ./scripts/config --disable NUMA || true
          ./scripts/config --disable DMA_CMA || true
          make ARCH=arm64 CROSS_COMPILE="${CROSS}" olddefconfig
          # PINCTRL 没有 prompt（只能被驱动 select）；IOMMU_API 依赖 IOMMU_SUPPORT
          # 与 ARCH_HAS_DMA_SET_COHERENT_MASK 之类，所以要在 olddefconfig 之后再补一轮。
          ./scripts/config --enable PINCTRL || true
          ./scripts/config --enable IOMMU_API || true
          make ARCH=arm64 CROSS_COMPILE="${CROSS}" olddefconfig
          echo "=== struct device 相关 Kconfig（实际值） ==="
          grep -E '^CONFIG_(PINCTRL|PINMUX|PINCONF|GENERIC_PINCONF|DMA_CMA|CMA|IOMMU_SUPPORT|IOMMU_API|GENERIC_MSI_IRQ|GENERIC_MSI_IRQ_DOMAIN|PCI_MSI|PCI|NUMA|PM|PM_SLEEP|PM_GENERIC_DOMAINS)=' .config \
            || echo "(无匹配)"
          # 硬断言：这 5 个 #ifdef 成员 + dev_archdata 全部位于 of_node 之前，
          # 任何一项与设备不一致 ⇒ 占位点跟着偏 ⇒ class/groups/release 全错 ⇒ 绑 UDC 当场 oops
          # （设备 panic_on_oops=1，没有"试试看"的余地）
          die=0
          for c in PINCTRL IOMMU_API; do
            if grep -q "^CONFIG_${c}=y" .config; then
              echo "  ✅ CONFIG_${c}=y"
            else
              echo "  ❌ CONFIG_${c} 不是 y —— struct device 在 of_node 之前会错位，绑 UDC 必 oops"
              die=1
            fi
          done
          # 必须为 n 的成员（注意判据不是同一组符号）：
          #   struct device 里的 `struct cma *cma_area` 由 CONFIG_DMA_CMA 把关，
          #     而 CONFIG_CMA 本身在这条 arm64 defconfig 上就是 y —— 与 struct device 无关，
          #     不要去关它（关了会连带拆掉 DMA_CMA 依赖，反而看不出差别）。
          #   `int numa_node` 由 CONFIG_NUMA 把关。
          #   `struct list_head msi_list` / `struct irq_domain *msi_domain`
          #     分别由 GENERIC_MSI_IRQ / GENERIC_MSI_IRQ_DOMAIN 把关（2026-10-03 修正）。
          # ⚠️ 这两个是隐藏符号（无 prompt），断言只认最终生效值 —— 如果这里报 ❌，
          #    修法**不是**去 --disable 它们，而是往上面找 select 者（PCI / PCI_MSI）。
          for c in DMA_CMA NUMA GENERIC_MSI_IRQ GENERIC_MSI_IRQ_DOMAIN; do
            if grep -q "^CONFIG_${c}=y" .config; then
              echo "  ❌ CONFIG_${c}=y —— 设备内核没有该成员，会让 struct device 在 of_node 之前整体错位"
              case "${c}" in
                GENERIC_MSI_IRQ|GENERIC_MSI_IRQ_DOMAIN)
                  echo "     ↳ 注意：它是**无 prompt 的隐藏符号**，--disable 无效。"
                  echo "       请确认 --disable PCI / --disable PCI_MSI 是否被别处 select 顶回来了。"
                  ;;
              esac
              die=1
            else
              echo "  ✅ CONFIG_${c} 已关闭"
            fi
          done
          [ "$die" = 0 ] || exit 1
          echo "✅ struct device 相关 Kconfig 已按设备实测目标（of_node=656 / class=752 / groups=760 / release=768）设置"
          # 第七处 ABI（TIMER_STATS）—— 它同时影响 struct device（经 dev_pm_info）
          # 与 struct snd_pcm_substream（经 pm_qos_request），两处都必须为 y。
          if grep -q "^CONFIG_TIMER_STATS=y" .config; then
            echo "  ✅ CONFIG_TIMER_STATS=y"
          else
            echo "  ❌ CONFIG_TIMER_STATS 不是 y —— struct timer_list 少 32 字节："
            echo "     · offsetof(snd_pcm_substream, runtime) 会算成 280（内核是 312）⇒ aplay 必 oops"
            echo "     · sizeof(struct device) 会算成 760 ⇒ 绑 UDC 必 oops"
            exit 1
          fi
          # ★★★ 第六处 ABI：struct snd_pcm 里 private_data 的偏移 ★★★
          #
          # 背景（详版见前面 `--enable SOUND` 那一段的注释）：我们原来漏了
          # `--enable SOUND`，导致 `--enable SND` 被 olddefconfig 静默撤销，
          # `CONFIG_SND_VERBOSE_PROCFS` 跟着变 n ⇒ `struct snd_pcm_str` 少了
          # proc_root / proc_info_entry 两个指针 ⇒ `struct snd_pcm` 里
          # offsetof(private_data) 比内核**小 32 字节**（2 个 stream × 16）。
          # 真机后果：aplay 打开 PCM → uac2_pcm_open+0x20 解引用 NULL → panic。
          #
          # 这三类判据都必须硬断言，因为 olddefconfig 的依赖解析是**静默**的：
          #   · SOUND / SND / SND_PCM 必须为 y —— 缺一个 SND 就整个不生效
          #   · SND_VERBOSE_PROCFS 必须为 y —— 设备侧实测（/proc/asound 里有
          #     `Loopback` 目录与 `card0/pcm0p/sub0/info`，只有 verbose procfs 才建）
          #   · SND_PCM_OSS / SND_SEQUENCER_OSS 必须不是 y —— 设备 /proc/asound
          #     下没有 `oss` 目录，且 kallsyms 里 snd_pcm_oss*/snd_pcm_plugin*
          #     计数全 0
          echo "=== struct snd_pcm 相关配置（实际值） ==="
          grep -E '^CONFIG_(SOUND|SND|SND_PCM|SND_PCM_OSS|SND_SEQUENCER_OSS|SND_VERBOSE_PROCFS|SND_PCM_ELD)=' .config \
            || echo "(无匹配 ⇒ SND 根本没开！)"
          die=0
          for c in SOUND SND SND_PCM SND_VERBOSE_PROCFS; do
            if grep -q "^CONFIG_${c}=y" .config; then
              echo "  ✅ CONFIG_${c}=y"
            else
              echo "  ❌ CONFIG_${c} 不是 y —— struct snd_pcm 的 private_data 会偏移，打开 PCM 必 oops"
              die=1
            fi
          done
          for c in SND_PCM_OSS SND_SEQUENCER_OSS SND_PCM_XRUN_DEBUG SND_DEBUG; do
            if grep -q "^CONFIG_${c}=y" .config; then
              echo "  ❌ CONFIG_${c}=y —— 设备内核没有该功能，struct snd_pcm_str 会多一段"
              die=1
            else
              echo "  ✅ CONFIG_${c} 已关闭"
            fi
          done
          [ "$die" = 0 ] || exit 1
          echo "✅ struct snd_pcm 相关 Kconfig 已按设备实测目标（VERBOSE_PROCFS=y / OSS=n）设置"
          # ★★ L1_CACHE_BYTES = 64（不是 arm64 主线的 128）★★
          #
          # `struct module` 以 `} ____cacheline_aligned;` 结尾，所以它的尺寸必然是
          # 对齐数的整数倍。设备实测（原厂 .ko 直读）：
          #     .gnu.linkonce.this_module  sh_size = 704，sh_addralign = 64
          # 而 704 = 64×11 —— **不是 128 的整数倍** ⇒ 厂商内核的
          # `____cacheline_aligned` = SMP_CACHE_BYTES = L1_CACHE_BYTES = 64。
          # arm64 主线 arch/arm64/include/asm/cache.h 里是
          #     #define L1_CACHE_SHIFT		7      → 128
          # 厂商改成了 6 → 64（Cortex-A35 的 L1 行本来就是 64 字节）。
          # 上一步 `set_cache_shift 7` 的实测对照：
          #     SHIFT=7 → size=768    SHIFT=6 → size=704   ← 与设备一致
          # 只改这一个宏：它只影响 `____cacheline_aligned` 的使用者，而我们的
          # 模块里几乎没有；不碰任何 Kconfig。
          CACHEH=arch/arm64/include/asm/cache.h
          echo "--- 原样 ---"; grep -n '^#define L1_CACHE_SHIFT' "$CACHEH"
          sed -i 's/^#define L1_CACHE_SHIFT.*/#define L1_CACHE_SHIFT\t\t6/' "$CACHEH"
          echo "--- 修正后 ---"; grep -n '^#define L1_CACHE_SHIFT' "$CACHEH"
          if ! grep -qE '^#define L1_CACHE_SHIFT[[:space:]]+6$' "$CACHEH"; then
            echo "❌ L1_CACHE_SHIFT 补丁没打上（锚点不匹配？）；直接失败，避免静默产出错布局"
            exit 1
          fi
          # ★★★ 第二处 ABI 复刻：usb_function_instance 尾部多一个 8 字节字段 ★★★
          #
          # 结论先写：**设备内核的 `struct config_group` 是 112 字节，与上游 4.4.159
          # 完全一样。configfs.h 不需要任何改动。** 前两轮把 +16 / +8 加在 configfs.h
          # 上，都是**推断错了**（把 free_func_inst 的偏移当成了 set_inst_name）。
          #
          # 这次不再推理 —— 证据是**内核自己的机器码**：
          #   oops 现场自带 `usb_put_function_instance` 的代码 dump（LR 指向它）；
          #   kallsyms 报 lr = usb_put_function_instance+0x20/0x38，把它反汇编：
          #       0x563c  cbz  x0, ...            ; if (!fi) return;
          #       0x5640  stp  x29,x30,[sp,#-32]!
          #       0x5644  mov  x29, sp
          #       0x5648  str  x19,[sp,#16]
          #       0x564c  ldr  x2, [x0, #128]     ; x2 = fi->fd
          #       0x5650  ldr  x1, [x0, #152]     ; x1 = fi->free_func_inst
          #       0x5654  ldr  x19,[x2, #8]       ; x19 = fd->mod
          #       0x5658  blr  x1                 ; ← 崩在这一条
          #       0x565c  mov  x0, x19
          #       0x5660  bl   module_put
          #   与 4.4 源码 `mod = fi->fd->mod; fi->free_func_inst(fi); module_put(mod);`
          #   逐条对上 ⇒ 这两条 ldr 就是这两个字段的偏移，没有别的解释空间。
          #
          # 由此推：
          #   fd @128，且 `struct list_head cfs_list` 占 16 字节
          #     ⇒ sizeof(config_group) = 128 - 16 = 112   ← 与上游一致
          #   free_func_inst @152，而上游布局里它应在 144
          #     ⇒ 设备内核在 set_inst_name(136) 之后**多了一个 8 字节字段**，
          #       sizeof(usb_function_instance) = 160（上游 152）
          #
          # 两条旁证：
          #   * abiprobe 探到内核写下的自指 list_head **只在 @32(ci_entry) 和
          #     @80(cg_children)**。若 config_group 真是 128（尾部长 16），新版
          #     config_group_init() 会 INIT_LIST_HEAD(default_groups)，
          #     就该多冒出一个 @104 的自指 list_head —— **没有**。
          #   * config_item 的字段（ci_namebuf@8 / ci_entry@32 / 名字在 8）完全对上。
          #
          # ⚠️ 前两轮为什么会被骗（这一段值得记住）：
          #   两次 oops 是同一个 bug 的两面 —— 内核去 `free_func_inst` 的位置取函数指针：
          #     · 补丁前：我们的 func_inst 只有 152 字节 ⇒ 152 处是 p_chmask=3 /
          #       p_srate=48000 ⇒ 调到 0x0000bb8000000003（第一次 oops 的 pc 就是它）
          #     · 加 +16 后：我们的 free_func_inst 落到 160，内核仍读 152
          #       ⇒ 152 处是我们的 set_inst_name = 0 ⇒ blr NULL（第二次 oops）
          #     · 加 +8 那一版**碰巧**把 free_func_inst 顶到 152，于是 mkdir/rmdir
          #       都能过 —— 但它是"凑对的"：cfs_list 被顶到 120，内核以为在 112，
          #       于是内核的 list_add_tail(&fi->cfs_list, ...) 写进了我们
          #       config_group 的尾部。功能上无害（那些字段我们不用），语义是错的。
          #   ⇒ 现在改成"每一项都落在内核期望的位置"。
          #
          # 🔴 还有个关键坑：为什么补错了 mkdir 却能成功、只有 rmdir 才崩？
          #   因为 4.4 的 `afunc_alloc_inst()` **从不设 set_inst_name**
          #   （f_uac2.c 里压根没有这个函数），而 function_make() 写的是
          #       if (fi->set_inst_name) { ret = fi->set_inst_name(fi, instance_name); }
          #   —— NULL 就跳过。所以 136~151 这一段"赌"什么都看不出来，
          #   只有 rmdir 走 usb_put_function_instance() 时才暴露。
          #   ⇒ **判据必须是 mkdir 和 rmdir 都过。**
          python3 - <<'PYPATCH_UAC2FI'
          import io, sys, re
          p = 'include/linux/usb/composite.h'
          s = io.open(p, encoding='utf-8').read()
          pat = re.compile(r'^[ \t]*void \(\*free_func_inst\)\(struct usb_function_instance \*inst\);[ \t]*$', re.M)
          hits = pat.findall(s)
          print('usb_function_instance.free_func_inst 锚点命中数 =', len(hits))
          if len(hits) != 1:
              sys.exit('❌ 锚点不是恰好 1 处，终止（不允许静默产出错布局）')
          new = (
              "\t/*\n"
              "\t * [PenMods ABI 复刻] 设备内核（rk3326 4.4.159）在这个位置多一个\n"
              "\t * 8 字节字段。依据是内核自己的 usb_put_function_instance() 机器码：\n"
              "\t *     ldr x2,[x0,#128]   ; fi->fd           ⇒ config_group 是 112\n"
              "\t *     ldr x1,[x0,#152]   ; fi->free_func_inst（上游应在 144）\n"
              "\t * 即 set_inst_name 仍在 136，free_func_inst 落在 152，中间 144 处\n"
              "\t * 必然还有一个 8 字节字段。\n"
              "\t * 保持 0 即可：4.4 的 f_uac2 根本不设 set_inst_name，内核也不会用到\n"
              "\t * 这个额外字段。\n"
              "\t * 不对齐的后果（真机 oops）：rmdir functions/uac2.0 时\n"
              "\t * usb_put_function_instance() 按 152 读到的不是我们的函数指针\n"
              "\t * （是 0，或 p_chmask/p_srate 之类的垃圾）⇒ blr 到 NULL/垃圾 ⇒\n"
              "\t * panic_on_oops=1 ⇒ 设备立刻重启。\n"
              "\t */\n"
              "\tvoid *__penmods_abi_pad;\n"
              "\tvoid (*free_func_inst)(struct usb_function_instance *inst);"
          )
          s = pat.sub(lambda _m: new, s, count=1)
          io.open(p, 'w', encoding='utf-8', newline='').write(s)
          print('composite.h ABI 补丁已应用（+8 字节占位）')
          PYPATCH_UAC2FI
          grep -n 'set_inst_name\|free_func_inst\|__penmods_abi_pad' include/linux/usb/composite.h

          # ★★★ 第五处 ABI：struct device 的成员偏移（占位补丁已于 2026-10-03 删除）★★★
          #
          # 目标值 —— 设备内核 device_add() 自己的机器码（x19 = dev）：
          #     [x19,#88]  = dev->type       —— 一致 ✅
          #     [x19,#752] = dev->class
          #     [x19,#760] = dev->groups
          #     [x19,#768] = dev->release
          # 这三条是**真机实测**，是我们唯一可以当锚点的硬数字（下面 CI 里已加断言）。
          #
          # 历史轨迹（三轮，写在这里避免下次再走一遍）：
          #   * 第一轮：按 /proc/kallsyms 反推，把 DMA_CMA / NUMA / MSI 全关
          #     —— **方向反了**（未开 KALLSYMS_ALL 时 kallsyms 只列函数，数据符号
          #     缺失是假阴性，不能当"该功能没编进内核"的证据），上机后 class 从 744 掉到 712。
          #   * 第二轮：把 PINCTRL(+8) 与 DMA_CMA(-8) 放开后**仍然**差 8，
          #     于是误判成"一个拿不到的厂商私有改动"，在 of_node 前补了 8 字节占位。
          #     —— 那是**两处错误相抵剩下的零头**，本轮已查清真因（见下）。
          #   * 第三轮（现行）：真因 = 我们多开 MSI +24、设备多开 TIMER_STATS −32，
          #     净差 −8。MSI 已改为 --disable、TIMER_STATS 已打开，占位补丁整个删除。
          #     详见上面「必须打开 CONFIG_TIMER_STATS」与「MSI 必须关」两段注释。
          #
          # 已用设备实测固定下来的成员（不要再动）：
          #   * CONFIG_NUMA  —— /sys/devices/system/node 不存在 ⇒ n
          #   * CONFIG_CMA/DMA_CMA —— /proc/kallsyms 里没有 cma_alloc ⇒ n
          #   * CONFIG_IOMMU_API —— /sys/class/iommu 存在 ⇒ y
          #   * CONFIG_PINCTRL   —— pinctrl_register / devm_pinctrl_get 都在 ⇒ y
          #   * CONFIG_GENERIC_MSI_IRQ / _DOMAIN —— /sys/devices/platform/*/msi_irqs
          #     count = 0、/sys/bus/pci 不存在 ⇒ n
          #
          # 不修好的后果（真机 oops，已复现一次，panic_on_oops=1 ⇒ 当场重启）：
          # f_uac2 按我们的偏移写 dev.release（错位时是 760），而那正是内核的
          # groups，device_add() 于是把这个函数指针当 attribute_group 数组遍历 ⇒ 崩。
          # ★★★ 2026-10-03 – 占位补丁已**整个删除** ★★★
          #
          # 这一版**故意不再往 device.h 里插任何东西**。理由见上面两段配置注释：
          # 那个"厂商私有的 +8 字节"并不存在，它是
          #     我们多开 GENERIC_MSI_IRQ/_DOMAIN (+24)  与
          #     设备多开 CONFIG_TIMER_STATS (−32，经 dev_pm_info 里的 timer_list)
          # 相抵剩下的 −8；把 MSI 关掉、把 TIMER_STATS 打开之后，
          #     sizeof(struct device)  = 792（与内核一致）
          #     dev->type=88 / class=752 / groups=760 / release=768（与内核机器码一致）
          # 全部由**配置**自然得到，不再需要任何占位。
          #
          # ⚠️ 这一步是"减代码"，但**没有任何安全垫被减掉**：原来真正兜底的是
          #    CI 里的尺寸指纹断言（sizeof(struct device)=792 等）和真机上的
          #    abiprobe 机器码对账，这两道现在都在，而且这一版还新增了
          #    offsetof(device,class/groups/release) 三条硬断言。
          #
          # 删掉它还有一个好处：占位是"补丁点 >= 真实差异点"的糊法，它只保证
          # `of_node` **之后**的偏移对得上，dev_pm_info **内部**仍然是错的
          # （内核写 dev->power.usage_count 等会落在我们以为的别的字段上）。
          # 现在 TIMER_STATS 一开，dev_pm_info 的内部布局也逐字节对上了。

          # ★★★ 关于 struct module 的 init/exit 偏移 ★★★
          #
          # 实测（原厂 hci_uart.ko / 8723ds.ko 的重定位表，两份互相印证）：
          #     sh_size=704   offsetof(name)=24   offsetof(init)=368   offsetof(exit)=680
          # arm64 4.4.159 在上面这套配置下编出来的是 init=344 / exit=672。
          #
          # ⚠️ 曾经在这里用 python 往 include/linux/module.h 里插
          #    `char __penmods_abi_pad0[24]` / `__penmods_abi_pad1[8]` 来凑偏移，
          #    但**那段代码从未真正执行过**（CI 日志里整段缺失，诊断步的
          #    SHIFT=7 BASE 仍然读出 init=344 就是铁证），而 patch 又是"锚点不匹配
          #    就静默跳过"的写法 —— 于是变成了一个看不见的坑。
          #    现在改成**链接后确定性改写**：tools/uac2-kmod/layout-patch.py
          #    直接按原厂 .ko 实测出的偏移搬移那两条重定位，并且改完自校验、
          #    不达标就 exit 1。见后面的「ABI 修正」步骤。
          # 记录关键配置项，便于和设备的 vermagic 对照
          echo "=== 影响 vermagic 的关键项 ==="
          grep -E '^CONFIG_(SMP|PREEMPT|PREEMPT_VOLUNTARY|PREEMPT_NONE|MODULE_UNLOAD|MODVERSIONS|MODULE_SIG|ARM64_4K_PAGES|ARM64_VA_BITS)' .config | sort
          # 自检：不要把"配置没生效"变成静默错误（olddefconfig 的依赖解析、
          # scripts/config 的拼写错误都可能导致静默失败）
          for c in CONFIG_DEBUG_SPINLOCK CONFIG_DEBUG_KERNEL; do
            if grep -q "^${c}=y" .config; then
              echo "  ✅ ${c}=y"
            else
              echo "  ❌ ${c} 没打开 —— 含自旋锁/互斥锁的结构体会整体错位，终止"
              exit 1
            fi
          done
          grep -n '^#define L1_CACHE_SHIFT' arch/arm64/include/asm/cache.h
          # ⚠️ GCC 10+ 默认 -fno-common，而 4.4 里 flex/bison 预生成的 dtc 老代码
          #    （dtc-lexer.lex.c 与 dtc-parser.tab.c）**各自定义了一份 `YYLTYPE yylloc;`**，
          #    于是链接脚本时报 multiple definition of `yylloc`。给 host 工具加回 -fcommon
          #    即可（这里显式复刻 4.4 的默认 HOSTCFLAGS 再追加，避免命令行覆盖丢 flag）。
          HOST_FLAGS="-Wall -Wmissing-prototypes -Wstrict-prototypes -O2 -fomit-frame-pointer -std=gnu89 -fcommon"
          make ARCH=arm64 CROSS_COMPILE="${CROSS}" HOSTCFLAGS="$HOST_FLAGS" \
            modules_prepare -j"$(nproc)"

      - name: 诊断内核源码中的 UAC 文件
        run: |
          FN="linux-${KVER}/drivers/usb/gadget/function"
          echo "=== function 目录里的 uac / audio 相关文件 ==="
          ls -la "$FN" | grep -iE 'uac|audio' || echo "(无匹配)"
          echo "=== Makefile 中的 uac2 规则 ==="
          grep -n -iE 'uac2|u_audio|g_audio' "$FN/Makefile" || true
          echo "=== 全树搜索 u_audio.h ==="
          find "linux-${KVER}" -name 'u_audio.h' -o -name 'u_uac2.h' | head
          echo "=== f_uac2.c / u_audio.c 的本地 #include 依赖 ==="
          grep -ho '^#include "[^"]*"' "$FN/f_uac2.c" "$FN/u_audio.c" 2>/dev/null | sort -u || true

      - name: 组装 out-of-tree 模块目录
        run: |
          FN="linux-${KVER}/drivers/usb/gadget/function"
          DEST="$GITHUB_WORKSPACE/tools/uac2-kmod"
          # 复制主源文件。4.4 只有 f_uac2.c（**自包含**，只 include u_uac2.h）；
          # u_audio.c 是 4.6+ 才从 f_uac2.c 抽出的 ALSA 公共层，4.4 里不存在，
          # 所以这里用循环试探而非硬列，避免 cp 某个不存在的文件直接崩。
          for f in f_uac2.c u_audio.c; do
            if [ -f "$FN/$f" ]; then cp -v "$FN/$f" "$DEST/"; else echo "(skip) $f 在本内核版本中不存在"; fi
          done
          # 自动解析并复制本地引号头（含二级依赖），避免手工遗漏
          for pass in 1 2 3; do
            for h in $(grep -ho '^#include "[^"]*"' "$DEST"/*.c "$DEST"/*.h 2>/dev/null \
                       | sed 's/.*"\(.*\)"/\1/' | sort -u); do
              [ -f "$DEST/$h" ] && continue
              if   [ -f "$FN/$h" ];                then cp -v "$FN/$h" "$DEST/"
              elif [ -f "linux-${KVER}/drivers/usb/gadget/$h" ]; then cp -v "linux-${KVER}/drivers/usb/gadget/$h" "$DEST/"
              fi
            done
          done
          echo "=== 模块目录最终内容 ==="
          ls -la "$DEST"

      - name: 修补 f_uac2.c 描述符 —— 让 Windows usbaudio2.sys 能启动设备
        run: |
          cd "$GITHUB_WORKSPACE"
          # ★★★ 第七处「复刻」：不是 ABI，而是**描述符合规性** ★★★
          #
          # 现象（2026-10-03 真机）：设备侧全链路已通（uac2.gs0 绑进 configs/b.1、
          # UDC state=configured、/proc/asound/cards 出现 UAC2_Gadget、ALSA 出
          # pcmC1D0{p,c}、无 oops），但 Windows 侧：
          #     USB\VID_2207&PID_0019&MI_00   MEDIA   Error
          #     Problem = CM_PROB_FAILED_START (Code 10)
          #     DEVPKEY_Device_ProblemStatus = 0xC0440025
          # 同一复合设备的 MI_03(WPD) / MI_04(ADB) 均正常，说明问题只出在音频功能。
          #
          # 根因（两条独立证据链指向同一结论）：
          #   ① Microsoft「USB Audio 2.0 Drivers」文档原文：
          #      "For the asynchronous OUT case, the driver supports explicit feedback
          #       only. A feedback endpoint must be implemented in the respective
          #       alternate setting of the AS interface. The driver doesn't support
          #       implicit feedback."
          #   ② wdmaudiodev 邮件列表里同为 UAC2 gadget 的开发者实测：
          #      "I get 0xC0440025 which ... means that the driver can't find the
          #       corresponding explicit sync input" —— 错误码**逐位对上**，
          #      且其后续复盘写着 "problems around 'no feedback endpoint for an
          #       asynchronous data OUT'"。
          # 我们 4.4 上游 f_uac2.c 的 4 个数据端点全部写成
          #     USB_ENDPOINT_XFER_ISOC | USB_ENDPOINT_SYNC_ASYNC   (= 0x05)
          # 却**完全没有实现 feedback 端点** ⇒ 正是 0xC0440025 的触发条件。
          #
          # ③ 第三方独立佐证：Rockchip 工程师 William Wu 的提交
          #    「usb: gadget: f_uac2: fix some issues for Windows recognized」
          #    （5e962a03f65f203a8d49aa771b5b7feeaa6fd6f5）对**同一份 4.4 代码**
          #    给出同样的结论："it's difficult to implement the feedback endpoint
          #    now. So the patch changes the bmAttributes of OUT-EP to adaptive,
          #    and changes the bmAttributes of IN-EP to synchronous at the same
          #    time." —— 本步骤就是照它做。
          # ④ Rockchip 厂商内核（rockchip-linux/kernel@develop-4.4，同代 rk3326 的
          #    正式发布内核）里 f_uac2.c 的实际取值，与本补丁**完全一致**：
          #      fs/hs_epout_desc.bmAttributes = ISOC | SYNC_ADAPTIVE  (0x09)
          #      fs/hs_epin_desc.bmAttributes  = ISOC | SYNC_SYNC      (0x0d)
          #      io_in_it_desc.wTerminalType   = UAC_INPUT_TERMINAL_MICROPHONE (0x0201)
          #      io_out_ot_desc.wTerminalType  = UAC_OUTPUT_TERMINAL_SPEAKER   (0x0301)
          #
          # 为什么「终端类型」也必须一起改：
          #    上游 f_uac2 把 io_in_it_desc / io_out_ot_desc 的 wTerminalType 写成
          #    UAC_{INPUT,OUTPUT}_TERMINAL_UNDEFINED（0x0200 / 0x0300）。
          #    raspberrypi/linux#4587 的完整排查记录里，最终**唯一**能让设备起来的
          #    改动就是这两个字段（"windows seems to be a little picky about the
          #    wTerminalType ... After I changed these ... it started to work"），
          #    上游随后以「usb: gadget: f_uac2: Define specific wTerminalType」系列
          #    补丁正式修掉。
          #
          # 第四处（wTotalLength）：UAC2 规范 4.7.2 要求 AC Header 的 wTotalLength
          #    "includes the combined length of this descriptor header and all Unit
          #    and Terminal descriptors"，而 4.4 的实现漏掉了自己这 9 字节。
          #    Rockchip 那个提交把它一并修了（"we also fix the wTotalLength of the
          #    ac_hdr_desc"），这里照做。
          #
          # ⚠️ 为什么选「改成 adaptive/synchronous」而不是「补上 feedback 端点」：
          #    实现 feedback 端点要新增端点、周期性发送 16.16 定点的反馈包，还得改
          #    ALSA 侧的回调；那是**在真机上跑的新代码路径**，而本项目的最高红线是
          #    「别把设备搞崩」。改两个 bmAttributes 是纯描述符常量，内核里没有
          #    任何代码根据这两个值分支 ⇒ 风险为零。Windows 文档明确支持
          #    "Adaptive IN and OUT" 与 "Synchronous IN and OUT"。
          #
          # ⚠️ 本轮**不动** c_srate 默认值（4.4 的 UAC2_DEF_CSRATE = 64000，非标准
          #    采样率，设备实测 c_srate=64000 / p_srate=48000）。它是下一个可疑点，
          #    但本轮的变量只保留「描述符」一个，便于错误码归因；真需要时可以先在
          #    设备上直接 `echo 48000 > .../uac2.gs0/c_srate` 试，不必重编。
          python3 - <<'PYPATCH_UAC2_WIN'
          import io, sys, re

          p = 'tools/uac2-kmod/f_uac2.c'
          s = io.open(p, encoding='utf-8').read()
          fails = []

          def sub1(pat, repl, label, flags=0):
              global s
              new, n = re.subn(pat, repl, s, count=1, flags=flags)
              print('  [%-34s] 命中 %d' % (label, n))
              if n != 1:
                  fails.append(label)
              else:
                  s = new

          # ① 终端类型：Windows usbaudio2.sys 不接受 UNDEFINED 终端
          sub1(r'UAC_INPUT_TERMINAL_UNDEFINED\b',
               'UAC_INPUT_TERMINAL_MICROPHONE', 'io_in_it_desc.wTerminalType')
          sub1(r'UAC_OUTPUT_TERMINAL_UNDEFINED\b',
               'UAC_OUTPUT_TERMINAL_SPEAKER', 'io_out_ot_desc.wTerminalType')

          # ② 数据端点的同步类型（0xC0440025 的直接元凶）
          for name, sync in (('fs_epout_desc', 'ADAPTIVE'), ('hs_epout_desc', 'ADAPTIVE'),
                             ('fs_epin_desc', 'SYNC'),     ('hs_epin_desc', 'SYNC')):
              sub1(r'(static struct usb_endpoint_descriptor ' + name +
                   r' = \{.*?\.bmAttributes = USB_ENDPOINT_XFER_ISOC \| USB_ENDPOINT_SYNC_)ASYNC',
                   r'\g<1>' + sync, name + '.bmAttributes', flags=re.S)

          # ③ AC Header 的 wTotalLength 漏掉了自己
          sub1(r'\.wTotalLength = sizeof in_clk_src_desc',
               '.wTotalLength = sizeof ac_hdr_desc + sizeof in_clk_src_desc',
               'ac_hdr_desc.wTotalLength')

          if fails:
              sys.exit('❌ 以下锚点没有恰好命中 1 次，终止（绝不允许静默产出 '
                       'Windows 认不出的描述符）: ' + ', '.join(fails))

          io.open(p, 'w', encoding='utf-8', newline='').write(s)
          print('f_uac2.c Windows 兼容补丁已应用（终端类型 + 同步类型 + wTotalLength）')
          PYPATCH_UAC2_WIN
          echo "=== 修补结果（期望：2 处 TERMINAL_，4 处 SYNC_ADAPTIVE/SYNC_SYNC，1 处 wTotalLength） ==="
          grep -n 'wTerminalType\|USB_ENDPOINT_SYNC\|wTotalLength' tools/uac2-kmod/f_uac2.c
          # 硬断言：任何一处漏改都必须让 CI 直接红，不能靠肉眼看日志
          if grep -q 'TERMINAL_UNDEFINED' tools/uac2-kmod/f_uac2.c; then
            echo "❌ 仍有 UNDEFINED 终端类型 ⇒ Windows 不会启动该功能"; exit 1
          fi
          if grep -q 'USB_ENDPOINT_SYNC_ASYNC' tools/uac2-kmod/f_uac2.c; then
            echo "❌ 仍有 SYNC_ASYNC 数据端点；Windows 要求其配套 feedback 端点（我们不实现）"; exit 1
          fi
          if grep -q 'wTotalLength = sizeof in_clk_src_desc' tools/uac2-kmod/f_uac2.c; then
            echo "❌ wTotalLength 没补上 ac_hdr_desc 自身长度"; exit 1
          fi
          echo "✅ 描述符已满足 Windows usbaudio2.sys 的音频流要求"

      # ─────────────────────────────────────────────────────────────────────
      # 门禁：C 注释提前终结（`/*/`）
      # ─────────────────────────────────────────────────────────────────────
      # 为什么单列一步：2026-10-03 CI run 37097331238 就是死在这里 ——
      # 我们在注释里写了设备路径的通配形式（platform 加 `*` `/`），那个 `*/`
      # 把注释**就地终结**，后面整段中文（UTF-8 首字节 0xEF）被当成 C 代码，
      # 一次炸出几十条 `stray '\357'` / `unknown type name`，要从上百行噪音里
      # 反推真因非常费时。检查器只有 20 行、零误报，放在编译之前最省事。
      - name: 门禁 —— C 注释提前终结检查（`/*/`）
        run: |
          cd "$GITHUB_WORKSPACE"
          python3 tools/uac2-kmod/c-comment-lint.py --dir tools/uac2-kmod

      - name: 编译 utest.ko（空模块探针，验证整条工具链）
        run: |
          cd "$GITHUB_WORKSPACE"
          make -C "linux-${KVER}" M="$PWD/tools/uac2-kmod" \
            ARCH=arm64 CROSS_COMPILE="${CROSS}" modules
          ls -la tools/uac2-kmod/*.ko

      - name: 编译 usb_uac2.ko（真实 UAC2 gadget 模块）
        id: build-uac2
        continue-on-error: true
        run: |
          cd "$GITHUB_WORKSPACE"
          # 依据实际复制到的源文件组装目标文件列表（4.4 只会是 f_uac2.o）
          OBJS=""
          for f in f_uac2.c u_audio.c; do
            [ -f "tools/uac2-kmod/$f" ] && OBJS="$OBJS ${f%.c}.o"
          done
          OBJS="${OBJS# }"
          echo "UAC2_OBJS = [$OBJS]"
          make -C "linux-${KVER}" M="$PWD/tools/uac2-kmod" \
            ARCH=arm64 CROSS_COMPILE="${CROSS}" WITH_UAC2=1 UAC2_OBJS="$OBJS" modules
          ls -la tools/uac2-kmod/*.ko

      - name: ABI 修正 —— 把 this_module 的两条重定位搬到设备内核的字段偏移
        run: |
          cd "$GITHUB_WORKSPACE"
          # 目标偏移的来源分两级，保证「可追溯」同时「CI 里自足」：
          #
          #   ① 若本机放有厂商参考模块（PENMODS_ABI_REF 或 kmod-out/vendor/*.ko），
          #      就**现取**偏移 —— 判据永远和设备一致。这是首选。
          #   ② 否则读仓库里提交的 tools/uac2-kmod/ref-abi.txt —— 一份只有 5 个
          #      数字的基准文件，里面写清了这两份厂商模块的路径与 md5，
          #      任何人都能拿设备上的 .ko 复核。
          #      ⚠️ 不把 2MB+ 的厂商二进制塞进仓库（体积 + 授权都不合适）。
          #   两条路都必须与 layout-patch.py 内置的实测默认值**对账**，
          #   任何一侧漂移就硬失败 —— 不允许静默用错偏移。
          REF="${PENMODS_ABI_REF:-}"
          if [ -z "$REF" ]; then
            for c in kmod-out/vendor/hci_uart.ko kmod-out/vendor/8723ds.ko; do
              [ -f "$c" ] && REF="$c" && break
            done
          fi
          python3 - "$REF" <<'PYABI'
          import importlib.util, re, sys
          ref_ko = sys.argv[1] if len(sys.argv) > 1 else ''
          spec = importlib.util.spec_from_file_location('lp', 'tools/uac2-kmod/layout-patch.py')
          lp = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(lp)
          builtin = {'size': lp.DEF_SIZE, 'name': lp.DEF_NAME_OFF,
                     'init': lp.DEF_INIT, 'exit': lp.DEF_EXIT}

          if ref_ko:
              kl = lp.KL
              d, shs = kl.load(ref_ko)
              syms = kl.symbols(d, shs)
              tm = rela = None
              for sh in shs:
                  if sh['sname'] == '.gnu.linkonce.this_module':
                      tm = sh
                  if sh['sname'] == '.rela.gnu.linkonce.this_module':
                      rela = sh
              if tm is None or rela is None:
                  sys.exit('❌ 参考模块 %s 里没有 this_module 节/重定位' % ref_ko)
              got = {'size': tm['size']}
              for r_offset, sidx, _ in kl.relocs(d, shs, rela):
                  nm = syms[sidx][0]
                  if nm == 'init_module':
                      got['init'] = r_offset
                  elif nm == 'cleanup_module':
                      got['exit'] = r_offset
              # 名字偏移直接扫
              body = kl.section_bytes(d, tm)
              for i in range(min(len(body), 256)):
                  j = body.find(b'\0', i)
                  if j < 0:
                      break
                  seg = body[i:j]
                  if 2 <= len(seg) <= 56 and all(32 <= c < 127 for c in seg):
                      got['name'] = i
                      break
              src = '厂商参考模块 %s' % ref_ko
          else:
              txt = open('tools/uac2-kmod/ref-abi.txt', encoding='utf-8').read()
              got = {k: int(v) for k, v in
                     re.findall(r'^(size|align|name|init|exit)\s*=\s*(\d+)', txt, re.M)}
              src = 'tools/uac2-kmod/ref-abi.txt'

          print('基准来源:', src)
          print('  基准值  :', got)
          print('  工具内置:', builtin)
          bad = [k for k, v in builtin.items() if got.get(k) != v]
          if bad:
              sys.exit('❌ 基准漂移: %s —— 基准(%s) 与 layout-patch.py 内置值(%s) 不一致，终止'
                       % (', '.join(bad), got, builtin))
          if got.get('align') not in (None, 64):
              sys.exit('❌ align 基准应为 64（L1_CACHE_BYTES=64），实为 %s' % got.get('align'))
          print('✅ 基准自洽（size=%d name=%d init=%d exit=%d align=64）'
                % (got['size'], got['name'], got['init'], got['exit']))
          PYABI

          rc=0
          for k in tools/uac2-kmod/*.ko; do
            [ -e "$k" ] || continue
            if [ -n "$REF" ]; then
              python3 tools/uac2-kmod/layout-patch.py "$k" --ref "$REF" || rc=1
            else
              python3 tools/uac2-kmod/layout-patch.py "$k" || rc=1
            fi
          done
          if [ "$rc" != 0 ]; then
            echo "❌ ABI 修正失败 —— 产物不可用，终止（不要让下载到错布局的 .ko）"
            exit 1
          fi
          echo "✅ 全部 .ko 的 this_module 布局已对齐设备内核"

      - name: 静态校验产物（vermagic / 未决符号 / 段信息）
        run: |
          cd "$GITHUB_WORKSPACE/tools/uac2-kmod"
          OUT="$GITHUB_WORKSPACE/kmod-report.txt"
          : > "$OUT"
          FAIL=0
          for k in *.ko; do
            [ -e "$k" ] || continue
            {
              echo "############ $k ############"
              echo "--- 文件大小 ---"; ls -la "$k"
              echo "--- vermagic（必须 = 4.4.159 SMP mod_unload aarch64）---"
              vm=$(strings "$k" | grep -E '^vermagic=' | sort -u | head -1)
              echo "  $vm"
              if [ "$vm" != "vermagic=${KVER} SMP mod_unload aarch64" ]; then
                echo "  ❌ vermagic 必须是 'vermagic=${KVER} SMP mod_unload aarch64'（多一个 preempt 都会 insmod 失败）"
                FAIL=1
              else
                echo "  ✅ vermagic 逐字匹配"
              fi
              echo "--- 模块元信息 ---"
              strings "$k" | grep -E '^(name|license|description|author)=' | sort -u
              echo "--- this_module 布局（设备实测：size=704 align=64 init=368 exit=680）---"
              # ⚠️ 不能用 awk 的 strtonum —— ubuntu runner 上的 awk 是 mawk，没有这个函数。
              #    改成 shell 的 16# 基数算术。
              line=$(aarch64-linux-gnu-objdump -h "$k" | awk '/gnu.linkonce.this_module/ {print; exit}')
              hx=$(echo "$line" | awk '{print $3}')
              alg=$(echo "$line" | awk '{print $NF}')
              if [ -n "$hx" ]; then
                dec=$((16#$hx))
                if [ "$dec" -eq 704 ] && [ "$alg" = "2**6" ]; then
                  echo "  ✅ size=$dec（=704）align=$alg（=64）—— 与原厂 .ko 逐字一致"
                else
                  echo "  ❌ size=$dec（期望 704）align=$alg（期望 2**6）"
                  echo "     ⇒ L1_CACHE_BYTES 或 struct module 成员没对齐"
                  FAIL=1
                fi
              else
                echo "  ❌ 未找到 .gnu.linkonce.this_module 节"
                FAIL=1
              fi
              echo "--- ABI 指纹（设备实测：init=368 exit=680，必须一致）---"
              fpout=$(python3 "$GITHUB_WORKSPACE/tools/uac2-kmod/kmod-layout.py" --fingerprint "$k" 2>/dev/null)
              echo "  $fpout"
              finit=$(echo "$fpout" | sed -n 's/.*init=\([0-9]*\).*/\1/p')
              fexit=$(echo "$fpout" | sed -n 's/.*exit=\([0-9]*\).*/\1/p')
              if [ "$finit" = "368" ] && [ "$fexit" = "680" ]; then
                echo "  ✅ init/exit 偏移与设备内核一致"
              else
                echo "  ❌ init=$finit exit=$fexit —— 设备要求 init=368 exit=680，模块无法被正确 init/exit"
                FAIL=1
              fi
              echo "--- 未决符号（需由内核提供，应与设备 kallsyms 对得上）---"
              aarch64-linux-gnu-nm -u "$k" | awk '{print $NF}' | sort -u
              echo "--- 本模块导出的符号 ---"
              aarch64-linux-gnu-nm --defined-only "$k" | grep -E ' [TtDdBbRr] ' | head -40 || true
              echo
            } >> "$OUT"
            echo "=== $k ==="; strings "$k" | grep -E '^vermagic=' | sort -u
          done
          cat "$OUT"
          if [ "$FAIL" != 0 ]; then
            echo "❌ 静态校验未通过（见上面的 ❌ 行）"
            exit 1
          fi
          echo "✅ 静态校验全部通过"

      - name: 上传内核模块产物
        uses: actions/upload-artifact@v4
        with:
          name: penmods-uac2-kmod-${{ env.KVER }}-${{ github.sha }}
          path: |
            tools/uac2-kmod/*.ko
            kmod-report.txt
          if-no-files-found: error
          retention-days: 7

      # ─────────────────────────────────────────────────────────────────────
      # 结构体尺寸指纹
      # ─────────────────────────────────────────────────────────────────────
      # 为什么需要：`struct module` 只是**一个** ABI。`usb_uac2.ko` 是**真驱动**，
      # 会碰 ALSA/USB 那一大票**内含 spinlock_t / struct mutex 的内核结构体**
      # （snd_card、snd_pcm_runtime、usb_gadget…）。这些结构体里任何一个成员
      # 尺寸不对，整块内存的字段偏移就全错 ⇒ 我们按自己的偏移读写、内核按它的
      # 偏移管理 = 真会搞坏内核。所以必须把「配置一致性」变成一个可测量的事实，
      # 而不是"看起来差不多"。
      #
      # 判据从哪来：设备 `/proc/slabinfo` 的 objsize 就是内核自己调用
      # `kmem_cache_create(name, sizeof(struct X), ...)` 的实参 —— ground truth。
      # 这里把同一批 `sizeof()` 编出来打一份，两边一比即可。
      - name: 结构体尺寸指纹（与设备 /proc/slabinfo 的 objsize 对照）
        run: |
          cd "$GITHUB_WORKSPACE"
          make -C "linux-${KVER}" M="$PWD/tools/uac2-kmod/sizeprobe" \
            ARCH=arm64 CROSS_COMPILE="${CROSS}" modules
          echo "=========== 结构体尺寸指纹（nm -S 的 size 列 = sizeof）==========="
          aarch64-linux-gnu-nm -S --defined-only \
            tools/uac2-kmod/sizeprobe/sizeprobe.ko \
            | awk '$3 ~ /^[BbDdRr]$/ {print $2, $4}' | sort -k2
          echo "=========== 影响这些尺寸的关键配置 ==========="
          grep -E '^CONFIG_(DEBUG_KERNEL|DEBUG_SPINLOCK|DEBUG_MUTEXES|DEBUG_LOCK_ALLOC|LOCKDEP|SMP|SYSFS|KALLSYMS|GENERIC_BUG|MODULES_TREE_LOOKUP|MODULE_UNLOAD|TRACEPOINTS|JUMP_LABEL|SOUND|SND|SND_PCM|SND_VERBOSE_PROCFS|SND_PCM_OSS|USB_GADGET)=' \
            "linux-${KVER}/.config" | sort
          # ─────────────────────────────────────────────────────────────────
          # 第六处 ABI：struct snd_pcm 的 private_data 偏移（2026-10-03 oops 根因）
          # ─────────────────────────────────────────────────────────────────
          # 为什么单独拉一节并**硬断言**：我们马上要把这个模块绑到 UDC（设备
          # panic_on_oops=1，没有"试试看"的余地），而 `alsa_uac2_init()` 里的
          # `pcm->private_data = uac2` 是一次**对内核结构体的写**。偏移错了不是
          # "加载失败"，而是**当场写坏内核结构体**（上次就是 aplay 时 oops + 重启）。
          # 期望值推导（布局明细见 sizeprobe.c 顶部注释，已逐条核对上游 v4.4 的
          # include/sound/pcm.h 原文 —— 第一次算的时候**漏了两个无条件成员**，
          # 把 848 算成 48，结果 CI 报 848 我还以为是布局错了）：
          #
          #   ★ 关键：struct snd_pcm_str 里除 OSS / PROCFS 的条件成员外，还有两个
          #     **无条件**成员：
          #         struct snd_kcontrol *chmap_kctl;   // 8 字节指针
          #         struct device dev;                 // ★ 不是指针，是**内嵌的整个
          #                                            //   struct device**（占位补丁
          #                                            //   之后 = 792 字节）
          #     ⇒ sizeof(snd_pcm_str) = 56 + sizeof(struct device) = 56 + 792 = 848
          #
          #   id[64] 到 36、name[80] 到 180、对齐 8 ⇒ streams @ 184
          #   open_mutex   = 184 + 2×848 = 1880   (+64  = sizeof(struct mutex))
          #   open_wait    = 1880 + 64   = 1944   (+40  = sizeof(wait_queue_head_t))
          #   private_data = 1944 + 40   = 1984  ★ aplay oops 的那个字段
          #
          # ⚠️ **第五处 ABI（struct device 占位补丁）与这一处是耦合的**：
          #    device 的大小每变 1 字节，private_data 就跟着变 2 字节
          #    （streams[2] 里各嵌一个 dev）。所以下面也把 sizeof(struct device)
          #    一起锁进断言 —— 否则改坏 device 时这一节会以一种很难懂的方式红。
          #
          # ⚠️ 还有第三层嵌套：`CONFIG_SND_PCM_XRUN_DEBUG`（`default y`，但
          #    `depends on SND_DEBUG`，而 SND_DEBUG 没有 default ⇒ 实际为 n）
          #    会在 PROCFS 块里再插 16 字节。已实测确认为 n。
          #
          # 设备侧判据（全部为真机实测）：
          #   VERBOSE_PROCFS=y ⇒ /proc/asound/card0/pcm0p/sub0/ 里有
          #                      hw_params / info / prealloc / prealloc_max /
          #                      status / sw_params 这六个文件
          #   XRUN_DEBUG=n     ⇒ 同一目录里**没有** xrun_debug
          #   SND_PCM_OSS=n    ⇒ /proc/asound 下没有 oss 目录
          # 这些数字全部由「设备内核的 Kconfig 实测值」推出；CI 报出别的值 = 我们的
          # .config 还没对准 ⇒ **必须停下，不要上机**（设备 panic_on_oops=1）。
          echo "=========== 第六处 ABI：struct snd_pcm 布局 ==========="
          NP="tools/uac2-kmod/sizeprobe/sizeprobe.ko"
          nmv() { aarch64-linux-gnu-nm -S --defined-only "$NP" | awk -v n="$1" '$4==n{print $2}'; }
          get_sz() { local v; v=$(nmv "$1"); if [ -n "$v" ]; then echo $((16#$v)); else echo "MISSING"; fi; }
          echo "  sizeof(struct mutex)                 = $(get_sz penmods_sz_mutex)  （期望 64）"
          echo "  sizeof(struct device)                = $(get_sz penmods_sz_device)  （期望 792）"
          echo "  sizeof(struct snd_pcm_str)           = $(get_sz penmods_sz_snd_pcm_str)  （期望 848 = 56 + 792）"
          echo "  sizeof(struct snd_pcm)               = $(get_sz penmods_sz_snd_pcm)  （期望 2008）"
          echo "  sizeof(struct snd_pcm_substream)     = $(get_sz penmods_sz_snd_pcm_substream)  （期望 584）"
          echo "  offsetof(snd_pcm, streams)           = $(get_sz penmods_off_snd_pcm_streams)  （期望 184）"
          echo "  offsetof(snd_pcm, open_mutex)        = $(get_sz penmods_off_snd_pcm_open_mutex)  （期望 1880）"
          echo "  offsetof(snd_pcm, open_wait)         = $(get_sz penmods_off_snd_pcm_open_wait)  （期望 1944）"
          echo "  offsetof(snd_pcm, private_data)      = $(get_sz penmods_off_snd_pcm_private_data)  （期望 1984）★"
          echo "  offsetof(snd_pcm, private_free)      = $(get_sz penmods_off_snd_pcm_private_free)  （期望 1992）"
          echo "  offsetof(snd_pcm_str, proc_root)     = $(get_sz penmods_off_snd_pcm_str_proc_root)  （期望 32）"
          echo "  offsetof(snd_pcm_substream, private_data) = $(get_sz penmods_off_snd_pcm_substream_private_data)  （期望 16）"
          echo "=========== 第七处 ABI：CONFIG_TIMER_STATS 链（2026-10-03 第二次 oops）==========="
          echo "  sizeof(struct timer_list)            = $(get_sz penmods_sz_timer_list)  （期望 80 = 48 + TIMER_STATS 的 32）"
          echo "  sizeof(struct delayed_work)          = $(get_sz penmods_sz_delayed_work)  （期望 128）"
          echo "  sizeof(struct work_struct)           = $(get_sz penmods_sz_work_struct)  （期望 32，LOCKDEP 必须为 n）"
          echo "  sizeof(struct pm_qos_request)        = $(get_sz penmods_sz_pm_qos_request)  （期望 176 = 40 + 8 + 128）"
          echo "  sizeof(struct dev_pm_info)           = $(get_sz penmods_sz_dev_pm_info)  （仅供参考）"
          echo "  offsetof(snd_pcm_substream, runtime) = $(get_sz penmods_off_snd_pcm_substream_runtime)  （期望 312）★★ oops 的字段"
          echo "  offsetof(snd_pcm_substream, latency_pm_qos_req) = $(get_sz penmods_off_snd_pcm_substream_latency_pm_qos_req)  （期望 64）"
          echo "  offsetof(snd_pcm_substream, dma_buffer)  = $(get_sz penmods_off_snd_pcm_substream_dma_buffer)  （期望 248）"
          echo "  offsetof(snd_pcm_substream, ops)     = $(get_sz penmods_off_snd_pcm_substream_ops)  （期望 304）"
          echo "  offsetof(snd_pcm_substream, pid)     = $(get_sz penmods_off_snd_pcm_substream_pid)  （期望 512）"
          echo "  offsetof(snd_pcm_substream, proc_root) = $(get_sz penmods_off_snd_pcm_substream_proc_root)  （期望 520）"
          echo "  offsetof(dev_pm_info, suspend_timer) = $(get_sz penmods_off_dev_pm_info_suspend_timer)  （dev_pm_info 内部）"
          echo "=========== 第五处 ABI：struct device 的四个锚点（设备 device_add 机器码实测）==========="
          echo "  offsetof(device, type)               = $(get_sz penmods_off_device_type)  （期望 88）"
          echo "  offsetof(device, class)              = $(get_sz penmods_off_device_class)  （期望 752）★"
          echo "  offsetof(device, groups)             = $(get_sz penmods_off_device_groups)  （期望 760）★"
          echo "  offsetof(device, release)            = $(get_sz penmods_off_device_release)  （期望 768）★"
          die=0
          _ck() { # _ck <符号> <期望值> <说明>
            local got; got=$(get_sz "$1")
            if [ "$got" = "$2" ]; then
              echo "  ✅ $3 = $got"
            else
              echo "  ❌ $3 = $got，期望 $2 —— 布局与设备内核不一致，**不要上机**"
              die=1
            fi
          }
          _ck penmods_sz_mutex                       64  "sizeof(struct mutex)"
          _ck penmods_sz_device                     792  "sizeof(struct device)（snd_pcm_str 的直接输入）"
          _ck penmods_sz_snd_pcm_str                848  "sizeof(struct snd_pcm_str)"
          _ck penmods_sz_snd_pcm                   2008  "sizeof(struct snd_pcm)"
          _ck penmods_off_snd_pcm_streams           184  "offsetof(snd_pcm, streams)"
          _ck penmods_off_snd_pcm_open_mutex       1880  "offsetof(snd_pcm, open_mutex)"
          _ck penmods_off_snd_pcm_open_wait        1944  "offsetof(snd_pcm, open_wait)"
          _ck penmods_off_snd_pcm_private_data     1984  "offsetof(snd_pcm, private_data)  ★ oops 的字段"
          _ck penmods_off_snd_pcm_private_free     1992  "offsetof(snd_pcm, private_free)"
          _ck penmods_off_snd_pcm_substream_private_data 16 "offsetof(snd_pcm_substream, private_data)"
          # ── 第七处 ABI（CONFIG_TIMER_STATS）──
          #    前三条任意一条不对 ⇒ --enable TIMER_STATS 没生效（olddefconfig 静默撤销）
          #    后两条不对       ⇒ snd_pcm_substream 布局与设备内核不一致 ⇒ aplay 必 oops
          _ck penmods_sz_timer_list                  80  "sizeof(struct timer_list)（TIMER_STATS=y ⇒ 48+32）"
          _ck penmods_sz_delayed_work               128  "sizeof(struct delayed_work)"
          _ck penmods_sz_pm_qos_request             176  "sizeof(struct pm_qos_request)"
          _ck penmods_off_snd_pcm_substream_latency_pm_qos_req 64 "offsetof(snd_pcm_substream, latency_pm_qos_req)"
          _ck penmods_off_snd_pcm_substream_runtime  312  "offsetof(snd_pcm_substream, runtime)  ★★ 第二次 oops 的字段"
          _ck penmods_sz_snd_pcm_substream          584  "sizeof(struct snd_pcm_substream)（runtime@312 + 尾部）"
          # ── 第五处 ABI（struct device 的四个锚点，device_add 机器码实测值）──
          #    这四条同时守住两件事：TIMER_STATS=y(+32) 与 MSI=n(−24) 必须**成对**，
          #    以及"占位补丁已删"之后没有回退。
          _ck penmods_off_device_type                88  "offsetof(device, type)"
          _ck penmods_off_device_class              752  "offsetof(device, class)  ★ 设备 device_add 机器码实测"
          _ck penmods_off_device_groups             760  "offsetof(device, groups)  ★ 同上"
          _ck penmods_off_device_release            768  "offsetof(device, release)  ★ 同上"
          [ "$die" = 0 ] || exit 1
          echo "  ✅ 三处 ABI 全部与设备内核一致（snd_pcm.private_data @1984 / snd_pcm_substream.runtime @312 / device.class @752）—— 可以安全绑 UDC"
