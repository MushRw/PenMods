name: Build UAC2 Kernel Module

# 为什么需要这个 workflow
# ------------------------
# 目标：让词典笔通过 USB 被电脑识别成「免驱音频设备」（电脑端零安装）。
# 电脑端零安装的 USB 音频只有一条标准路径：USB Audio Class（UAC）。
#
# 但设备内核实测缺两样东西：
#   1) configfs 建不出 uac2.0 —— 内核没编 f_uac2 / u_audio
#      （用原厂脚本的真实实例名 uac1.gs0/uac2.gs0/uac1.0/audio.0 复测，全部 ENOENT）
#   2) FunctionFS 也写不出 UAC 描述符 —— 4.4 的 f_fs.c 里 ffs_do_single_desc()
#      对 bDescriptorType 是精确 switch，只认 INTERFACE(0x04)/ENDPOINT(0x05)/
#      HID_DT_HID(0x21)/OTG(0x09)/IASSOC(0x0B)/SS_EP_COMP(0x30)，其余落 default
#      直接 -EINVAL。UAC 必需的 CS_INTERFACE(0x24)/CS_ENDPOINT(0x25) 必然被拒。
#      （实测：0x21 能过不是「透传」，而是它恰好等于 HID_DT_HID）
#
# 唯一的出路：自己编 f_uac2.ko + u_audio.ko 加载进内核。实测这三条同时成立：
#   * CONFIG_MODULES=y      —— /proc/modules 里真跑着 hci_uart / 8723ds
#   * CONFIG_MODVERSIONS=n  —— 现有 .ko 里 __crc_ 符号数 = 0
#                              ⇒ 不需要 Module.symvers，**不必编译整个内核**
#   * 模块未签名、modules_disabled=0
#   * vermagic = 4.4.159 SMP mod_unload aarch64（精确版本已知）
#   * f_uac2 依赖的 gadget 核心符号（usb_add_function / usb_ep_autoconfig /
#     config_ep_by_speed ...）与 ALSA 符号在设备 kallsyms 中全部存在
#
# 因为 vermagic 里的版本号必须严格是 4.4.159，而 4.4.159 恰好是上游正式发布版，
# 直接取 kernel.org 的源码即可拿到天然匹配的 vermagic，无需手工篡改。
#
# ⚠️ 本 workflow 只负责「编译 + 静态校验」，**不接触设备**。
#    加载与验证在本地用 adb 分台阶做（见 tools/uac2-kmod/ 注释）。

on:
  # workflow_dispatch 端点只对「默认分支上存在的 workflow」注册，本文件目前
  # 只在 fix/batch1-safety-perf 上，直接 dispatch 会 404，因此主入口走 push：
  # 改动模块源码或本文件即自动重编，方便多轮迭代。
  push:
    paths:
      - 'tools/uac2-kmod/**'
      - '.github/workflows/build-uac2-kmod.yaml'
  workflow_dispatch:
    inputs:
      kernel_version:
        description: '目标内核版本（必须与设备 vermagic 一致，当前 = 4.4.159）'
        required: true
        default: '4.4.159'

env:
  KVER: ${{ github.event.inputs.kernel_version || '4.4.159' }}
  CROSS: aarch64-linux-gnu-

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: 安装构建依赖
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            build-essential bc flex bison libssl-dev libelf-dev \
            wget xz-utils gcc-aarch64-linux-gnu
          # 用系统 GCC 11 编 host 工具（modpost/fixdep）。
          # 不用 archlinux:latest 是因为它的 GCC 14+ 会把
          # implicit-function-declaration 升级成 error，编不过 4.4 的老脚本。
          aarch64-linux-gnu-gcc --version | head -1
          gcc --version | head -1

      - name: 检出代码
        uses: actions/checkout@v4

      - name: 缓存内核源码包
        id: cache-ksrc
        uses: actions/cache@v4
        with:
          path: linux-${{ env.KVER }}.tar.xz
          key: linux-src-tar-${{ env.KVER }}

      - name: 下载内核源码
        if: steps.cache-ksrc.outputs.cache-hit != 'true'
        run: |
          wget -q "https://cdn.kernel.org/pub/linux/kernel/v4.x/linux-${KVER}.tar.xz"
          ls -la "linux-${KVER}.tar.xz"

      - name: 解压内核源码
        run: |
          tar xf "linux-${KVER}.tar.xz"
          ls -d "linux-${KVER}"
          head -5 "linux-${KVER}/Makefile"

      - name: 配置内核并准备模块头文件
        run: |
          cd "linux-${KVER}"
          make ARCH=arm64 CROSS_COMPILE="${CROSS}" defconfig
          # 关掉会引入 libssl 3.x 不兼容的签名相关项（省掉 extract-cert 编译坑）
          ./scripts/config \
            --disable MODULE_SIG --disable MODULE_SIG_ALL \
            --disable SYSTEM_TRUSTED_KEYRING --disable SYSTEM_REVOCATION_KEYS \
            --disable MODULE_SIG_FORCE || true
          # 打开 UAC2 / ALSA 依赖，让 f_uac2.c 能拿到完整的 sound / gadget 头文件
          # （4.4 的实际开关名是 USB_F_UAC2，由 USB_CONFIGFS_F_UAC2 select）
          ./scripts/config \
            --enable SND --enable SND_PCM --enable SND_PCM_ELD \
            --enable USB_GADGET --enable USB_LIBCOMPOSITE \
            --enable USB_CONFIGFS --enable USB_CONFIGFS_F_UAC2 || true
          # ⚠️ 必须关掉 PREEMPT：上游 arm64 defconfig 开着 CONFIG_PREEMPT，编出来的
          #    vermagic 是 "4.4.159 SMP preempt mod_unload aarch64"，而设备实测是
          #    "4.4.159 SMP mod_unload aarch64"（无 preempt）。差一个词就 insmod 不了
          #    （invalid module format），而且 PREEMPT 本身也会影响部分结构体布局。
          ./scripts/config \
            --disable PREEMPT --disable PREEMPT_VOLUNTARY \
            --enable PREEMPT_NONE --disable PREEMPT_COUNT || true
          # ★★ 对齐设备内核的 struct module 布局（最关键的一步）
          #
          # 实测证据：原厂 hci_uart.ko / 8723ds.ko 的 .gnu.linkonce.this_module
          # 节大小都是 704，而用上游 arm64 defconfig 编出来的是 768 —— 差 64 字节。
          # 后果：内核按**它自己的**偏移往这块内存里读写字段，我们读的是**我们的**
          # 偏移 ⇒ /proc/modules 里 refcount 打出 9400318 这种垃圾值（其实是
          # module_core 基址 0x8F7000 附近），rmmod 报 EAGAIN
          # ("Resource temporarily unavailable")。
          #
          # 差 64 字节的来源已用设备 /proc/kallsyms 反推确认（函数符号表是完整的）：
          #   | 判据（kallsyms 里的符号）        | 设备 | 结论                        |
          #   | static_key*/jump_label* 计数     |  0   | CONFIG_JUMP_LABEL=n         |
          #   | *ftrace* 计数 / /sys/kernel/tracing | 0 / 无 | FTRACE/TRACING/TRACEPOINTS |
          #   |                                  |      | /EVENT_TRACING 全 = n       |
          #   | klp_enable_patch                 |  无  | CONFIG_LIVEPATCH=n          |
          #   | mod_verify_sig                   |  无  | CONFIG_MODULE_SIG=n         |
          #   | module_refcount/try_module_get   | 有   | CONFIG_MODULE_UNLOAD=y      |
          #   | kallsyms_lookup_name             | 有   | CONFIG_KALLSYMS=y（ALL=n）  |
          # ⇒ 设备把整个 tracing 子系统砍了，而那正好是 struct module 里
          #   TRACEPOINTS / HAVE_JUMP_LABEL / TRACING / EVENT_TRACING /
          #   FTRACE_MCOUNT_RECORD 这 5 个 #ifdef 块。
          # 另外用户栈顶 0x7ff4039000 紧贴 0x8000000000 ⇒ VA_BITS=39（上游是 48），
          # 一并还原以求配置忠实（这一项不改变 struct module 大小）。
          ./scripts/config \
            --disable FTRACE --disable FUNCTION_TRACER --disable DYNAMIC_FTRACE \
            --disable FTRACE_MCOUNT_RECORD --disable STACK_TRACER \
            --disable FUNCTION_GRAPH_TRACER --disable TRACING \
            --disable TRACEPOINTS --disable EVENT_TRACING \
            --disable TRACEPOINT_BENCHMARK --disable TRACER_SNAPSHOT \
            --disable LIVEPATCH --disable JUMP_LABEL \
            --disable KALLSYMS_ALL --disable DEBUG_INFO --disable DEBUG_INFO_DWARF4 \
            --disable ARM64_VA_BITS_48 --enable ARM64_VA_BITS_39 \
            || true
          make ARCH=arm64 CROSS_COMPILE="${CROSS}" olddefconfig
          # ★★ ABI 复刻：把 struct module 的字段偏移对齐到设备内核 ★★
          # 为什么需要：modpost 生成的 .mod.c 里，我们只给
          #   .name / .init / .exit / .arch 四个字段赋初值；
          # 其余字段全部由内核按【它自己的】偏移读写，自成一套、彼此自洽。
          # ⇒ 唯一必须对齐的是 name / init / exit 三个偏移（name 天然在 24）。
          # 实测（厂商 .ko 的重定位表，两份互相印证）：
          #   size=704  offsetof(init)=368  offsetof(exit)=680
          # 上游 4.4.159 + 任何我们能找到的 Kconfig 组合都编不出 368/680：
          #   我们的 init=344（init 之前少 24 字节）、exit=672（init→exit 之间少 8 字节）。
          # 那 24 字节最可能是 struct mutex 里 spinlock_t 的尺寸差（实测 +DEBUG_SPINLOCK
          # 恰好把 init 顶到 368），但与其猜配置，不如按实测偏移直接补齐 —— 只影响
          # struct module 这一个 ABI，不牵动其它任何结构体。
          python3 - <<'PYPATCH'
          import io
          p = 'include/linux/module.h'
          s = io.open(p, encoding='utf-8').read()
          pad0 = (
              "\t/*\n"
              "\t * [PenMods ABI 复刻] 设备内核的 struct module 在 init 之前比上游\n"
              "\t * 4.4.159 多 24 字节（实测厂商 hci_uart.ko / 8723ds.ko 的 init 在\n"
              "\t * 偏移 368，上游源码编出来是 344）。内核按它自己的偏移读\n"
              "\t * mod->init/.exit，而我们按自己的偏移写这两个值，所以必须对齐。\n"
              "\t * 其余字段内核自成一套、彼此自洽，无需对齐。\n"
              "\t */\n"
              "\tchar __penmods_abi_pad0[24];\n\n"
          )
          old = "\t/* Startup function. */\n\tint (*init)(void);"
          print('init 锚点出现次数 =', s.count(old))
          if s.count(old) == 1:
              s = s.replace(old, pad0 + old)
          else:
              print('!!! init 锚点不唯一，未应用补丁')
          old2 = ("\t/* What modules depend on me? */\n"
                  "\tstruct list_head source_list;")
          print('source_list 锚点出现次数 =', s.count(old2))
          if s.count(old2) == 1:
              pad1 = ("\t/* [PenMods ABI 复刻] init→exit 之间再多 8 字节"
                      "（实测 exit 在 680，上游是 672） */\n"
                      "\tchar __penmods_abi_pad1[8];\n\n")
              s = s.replace(old2, pad1 + old2, 1)
          else:
              print('!!! source_list 锚点不唯一，未应用补丁')
          io.open(p, 'w', encoding='utf-8', newline='').write(s)
          print('module.h ABI 补丁已应用')
          PYPATCH
          # 记录关键配置项，便于和设备的 vermagic 对照
          echo "=== 影响 vermagic 的关键项 ==="
          grep -E '^CONFIG_(SMP|PREEMPT|PREEMPT_VOLUNTARY|PREEMPT_NONE|MODULE_UNLOAD|MODVERSIONS|MODULE_SIG|ARM64_4K_PAGES|ARM64_VA_BITS)' .config | sort
          # ⚠️ GCC 10+ 默认 -fno-common，而 4.4 里 flex/bison 预生成的 dtc 老代码
          #    （dtc-lexer.lex.c 与 dtc-parser.tab.c）**各自定义了一份 `YYLTYPE yylloc;`**，
          #    于是链接脚本时报 multiple definition of `yylloc`。给 host 工具加回 -fcommon
          #    即可（这里显式复刻 4.4 的默认 HOSTCFLAGS 再追加，避免命令行覆盖丢 flag）。
          HOST_FLAGS="-Wall -Wmissing-prototypes -Wstrict-prototypes -O2 -fomit-frame-pointer -std=gnu89 -fcommon"
          make ARCH=arm64 CROSS_COMPILE="${CROSS}" HOSTCFLAGS="$HOST_FLAGS" \
            modules_prepare -j"$(nproc)"

      - name: 诊断内核源码中的 UAC 文件
        run: |
          FN="linux-${KVER}/drivers/usb/gadget/function"
          echo "=== function 目录里的 uac / audio 相关文件 ==="
          ls -la "$FN" | grep -iE 'uac|audio' || echo "(无匹配)"
          echo "=== Makefile 中的 uac2 规则 ==="
          grep -n -iE 'uac2|u_audio|g_audio' "$FN/Makefile" || true
          echo "=== 全树搜索 u_audio.h ==="
          find "linux-${KVER}" -name 'u_audio.h' -o -name 'u_uac2.h' | head
          echo "=== f_uac2.c / u_audio.c 的本地 #include 依赖 ==="
          grep -ho '^#include "[^"]*"' "$FN/f_uac2.c" "$FN/u_audio.c" 2>/dev/null | sort -u || true

      - name: 组装 out-of-tree 模块目录
        run: |
          FN="linux-${KVER}/drivers/usb/gadget/function"
          DEST="$GITHUB_WORKSPACE/tools/uac2-kmod"
          # 复制主源文件。4.4 只有 f_uac2.c（**自包含**，只 include u_uac2.h）；
          # u_audio.c 是 4.6+ 才从 f_uac2.c 抽出的 ALSA 公共层，4.4 里不存在，
          # 所以这里用循环试探而非硬列，避免 cp 某个不存在的文件直接崩。
          for f in f_uac2.c u_audio.c; do
            if [ -f "$FN/$f" ]; then cp -v "$FN/$f" "$DEST/"; else echo "(skip) $f 在本内核版本中不存在"; fi
          done
          # 自动解析并复制本地引号头（含二级依赖），避免手工遗漏
          for pass in 1 2 3; do
            for h in $(grep -ho '^#include "[^"]*"' "$DEST"/*.c "$DEST"/*.h 2>/dev/null \
                       | sed 's/.*"\(.*\)"/\1/' | sort -u); do
              [ -f "$DEST/$h" ] && continue
              if   [ -f "$FN/$h" ];                then cp -v "$FN/$h" "$DEST/"
              elif [ -f "linux-${KVER}/drivers/usb/gadget/$h" ]; then cp -v "linux-${KVER}/drivers/usb/gadget/$h" "$DEST/"
              fi
            done
          done
          echo "=== 模块目录最终内容 ==="
          ls -la "$DEST"

      - name: 编译 utest.ko（空模块探针，验证整条工具链）
        run: |
          cd "$GITHUB_WORKSPACE"
          make -C "linux-${KVER}" M="$PWD/tools/uac2-kmod" \
            ARCH=arm64 CROSS_COMPILE="${CROSS}" modules
          ls -la tools/uac2-kmod/*.ko

      - name: 编译 usb_uac2.ko（真实 UAC2 gadget 模块）
        id: build-uac2
        continue-on-error: true
        run: |
          cd "$GITHUB_WORKSPACE"
          # 依据实际复制到的源文件组装目标文件列表（4.4 只会是 f_uac2.o）
          OBJS=""
          for f in f_uac2.c u_audio.c; do
            [ -f "tools/uac2-kmod/$f" ] && OBJS="$OBJS ${f%.c}.o"
          done
          OBJS="${OBJS# }"
          echo "UAC2_OBJS = [$OBJS]"
          make -C "linux-${KVER}" M="$PWD/tools/uac2-kmod" \
            ARCH=arm64 CROSS_COMPILE="${CROSS}" WITH_UAC2=1 UAC2_OBJS="$OBJS" modules
          ls -la tools/uac2-kmod/*.ko

      - name: 静态校验产物（vermagic / 未决符号 / 段信息）
        run: |
          cd "$GITHUB_WORKSPACE/tools/uac2-kmod"
          OUT="$GITHUB_WORKSPACE/kmod-report.txt"
          : > "$OUT"
          for k in *.ko; do
            [ -e "$k" ] || continue
            {
              echo "############ $k ############"
              echo "--- 文件大小 ---"; ls -la "$k"
              echo "--- vermagic（必须 = 4.4.159 SMP mod_unload aarch64）---"
              strings "$k" | grep -E '^vermagic=' | sort -u
              echo "--- 模块元信息 ---"
              strings "$k" | grep -E '^(name|license|description|author)=' | sort -u
              echo "--- sizeof(struct module)：设备实测 = 704（0x2c0），必须一致 ---"
              # ⚠️ 不能用 awk 的 strtonum —— ubuntu runner 上的 awk 是 mawk，没有这个函数。
              #    改成 shell 的 16# 基数算术。
              hx=$(aarch64-linux-gnu-objdump -h "$k" | awk '/this_module/ {print $3; exit}')
              if [ -n "$hx" ]; then
                dec=$((16#$hx))
                if [ "$dec" -ge 704 ]; then
                  echo "  ✅ .gnu.linkonce.this_module = 0x$hx = $dec  —— >= 设备内核的 704（留余量无妨，内核只按自己的 704 访问）"
                else
                  echo "  ❌ .gnu.linkonce.this_module = 0x$hx = $dec  —— 小于设备的 704，内核会写到我们的节之外"
                fi
              else
                echo "  ⚠️ 未找到 .gnu.linkonce.this_module 节"
              fi
              echo "--- ABI 指纹（设备实测：init=368 exit=680，必须一致）---"
              fpout=$(python3 "$GITHUB_WORKSPACE/tools/uac2-kmod/kmod-layout.py" --fingerprint "$k" 2>/dev/null)
              echo "  $fpout"
              finit=$(echo "$fpout" | sed -n 's/.*init=\([0-9]*\).*/\1/p')
              fexit=$(echo "$fpout" | sed -n 's/.*exit=\([0-9]*\).*/\1/p')
              if [ "$finit" = "368" ] && [ "$fexit" = "680" ]; then
                echo "  ✅ init/exit 偏移与设备内核一致"
              else
                echo "  ❌ init=$finit exit=$fexit —— 设备要求 init=368 exit=680，模块无法被正确 init/exit"
              fi
              echo "--- 未决符号（需由内核提供，应与设备 kallsyms 对得上）---"
              aarch64-linux-gnu-nm -u "$k" | awk '{print $NF}' | sort -u
              echo "--- 本模块导出的符号 ---"
              aarch64-linux-gnu-nm --defined-only "$k" | grep -E ' [TtDdBbRr] ' | head -40 || true
              echo
            } >> "$OUT"
            echo "=== $k ==="; strings "$k" | grep -E '^vermagic=' | sort -u
          done
          cat "$OUT"

      - name: 上传内核模块产物
        uses: actions/upload-artifact@v4
        with:
          name: penmods-uac2-kmod-${{ env.KVER }}-${{ github.sha }}
          path: |
            tools/uac2-kmod/*.ko
            kmod-report.txt
          if-no-files-found: error
          retention-days: 7

      # ─────────────────────────────────────────────────────────────────────
      # 布局诊断：解 struct module 布局之谜（判据 = init/exit 偏移 + 总大小）
      # ─────────────────────────────────────────────────────────────────────
      # 已确认的事实链：
      #  1) 厂商 .ko 的 .gnu.linkonce.this_module 重定位 r_offset = 内核真实字段偏移
      #     hci_uart.ko / 8723ds.ko 一致给出：size=704 init=368 exit=680
      #     我们的产物：                      size=768 init=344 exit=672
      #  2) include/linux/module.h 里 struct module 结尾是 `} ____cacheline_aligned;`，
      #     且 `void *module_init ____cacheline_aligned;` —— 即按 SMP_CACHE_BYTES 对齐。
      #  3) arch/arm64/include/asm/cache.h 里 **硬编码** `#define L1_CACHE_SHIFT 7`
      #     ⇒ L1_CACHE_BYTES = SMP_CACHE_BYTES = 128。
      #     而设备是 704 = 11*64，**不是 128 的整数倍** ⇒ 厂商内核的 L1_CACHE_BYTES = 64。
      #  4) pahole 显示我们的成员在偏移 684 处结束，align64(684) = 704 —— 完全吻合。
      #
      # ⇒ 需要三件事同时成立：
      #      A) L1_CACHE_SHIFT 改成 6（必须改头文件，不是 Kconfig）
      #      B) init 之前要多 24 字节
      #      C) init→exit 之间要多 8 字节
      #    下面把这个假设直接编出来验证，并量化各候选开关的贡献。
      #
      # ⚠️ 本步骤故意放在「上传产物」**之后**：它会改 .config 和 cache.h，
      #    绝不能污染待上传的 .ko（md5 要和设备侧比对）。
      - name: 布局诊断（对齐常量 + 子结构体尺寸 + 配置矩阵指纹）
        if: always()
        continue-on-error: true
        run: |
          set +e
          cd "$GITHUB_WORKSPACE/linux-${KVER}"
          mkdir -p /tmp/lp
          printf 'obj-m += p.o\nCFLAGS_p.o := -g -fno-eliminate-unused-debug-types\n' > /tmp/lp/Makefile
          cat > /tmp/lp/p.c <<'EOF'
          #include <linux/module.h>
          #include <linux/kernel.h>
          #include <linux/init.h>
          #include <linux/mutex.h>
          #include <linux/kobject.h>
          #include <asm/cache.h>
          struct module penmods_dummy_module __attribute__((used));
          char penmods_l1_cache_bytes[L1_CACHE_BYTES] __attribute__((used));
          char penmods_smp_cache_bytes[SMP_CACHE_BYTES] __attribute__((used));
          char penmods_sz_mutex[sizeof(struct mutex)] __attribute__((used));
          char penmods_sz_kobject[sizeof(struct kobject)] __attribute__((used));
          char penmods_sz_mkobj[sizeof(struct module_kobject)] __attribute__((used));
          char penmods_sz_modarch[sizeof(struct mod_arch_specific) + 1] __attribute__((used));
          static int __init p_init(void) { return 0; }
          static void __exit p_exit(void) { }
          module_init(p_init);
          module_exit(p_exit);
          MODULE_LICENSE("GPL");
          EOF

          CACHEH=arch/arm64/include/asm/cache.h
          cp "$CACHEH" /tmp/cache.h.orig
          set_cache_shift() {
            cp /tmp/cache.h.orig "$CACHEH"
            sed -i "s/^#define L1_CACHE_SHIFT.*/#define L1_CACHE_SHIFT\t\t$1/" "$CACHEH"
          }
          cp .config /tmp/base.config
          reset_cfg() {
            cp /tmp/base.config .config
            make ARCH=arm64 CROSS_COMPILE="${CROSS}" olddefconfig >/dev/null 2>&1
            make ARCH=arm64 CROSS_COMPILE="${CROSS}" silentoldconfig < /dev/null >/dev/null 2>&1
          }
          fp() { python3 "$GITHUB_WORKSPACE/tools/uac2-kmod/kmod-layout.py" --fingerprint "$1" 2>/dev/null \
                   | awk '{printf "%-30s", $1" "$2" "$3}'; }
          rebuild() {
            find /tmp/lp -name '*.o'    -delete 2>/dev/null
            find /tmp/lp -name '*.ko'   -delete 2>/dev/null
            find /tmp/lp -name '.*.cmd' -delete 2>/dev/null
            rm -f /tmp/lp/modules.order /tmp/lp/Module.symvers 2>/dev/null
            make M=/tmp/lp ARCH=arm64 CROSS_COMPILE="${CROSS}" modules >/tmp/lp/build.log 2>&1
          }
          symstate() {  # $1=CONFIG_XXX -> Y / N
            if grep -q "^$1=" .config; then echo -n Y; else echo -n N; fi
          }
          # probe <label> <要自检的config名> <toggles...>   环境变量 SHIFT 控制对齐
          probe() {
            local label="$1"; local sym="$2"; shift 2
            reset_cfg
            if [ "$#" -gt 0 ]; then ./scripts/config "$@" >/dev/null 2>&1; fi
            make ARCH=arm64 CROSS_COMPILE="${CROSS}" olddefconfig >/dev/null 2>&1
            make ARCH=arm64 CROSS_COMPILE="${CROSS}" silentoldconfig < /dev/null >/dev/null 2>&1
            set_cache_shift "${SHIFT:-7}"
            rebuild
            printf '  %-32s %s [%s=%s]\n' "$label" "$(fp /tmp/lp/p.ko)" "$sym" "$(symstate "$sym")"
          }

          echo "################ 1. 关键常量与子结构体尺寸（cache.h shift=7 原样）################"
          reset_cfg; set_cache_shift 7; rebuild
          aarch64-linux-gnu-nm -S /tmp/lp/p.ko 2>/dev/null | grep -E 'penmods_(l1|smp|sz_|dummy)' || true

          echo
          echo "################ 2. 假设验证：L1_CACHE_SHIFT 6 vs 7 ################"
          echo "--- 目标：size=704 init=368 exit=680 ---"
          SHIFT=7 probe "L1SHIFT=7 BASE"            CONFIG_SMP
          SHIFT=6 probe "L1SHIFT=6 BASE"            CONFIG_SMP

          echo
          echo "################ 3. 在 L1SHIFT=6 基础上找 init 之前那 24 字节 ################"
          SHIFT=6 probe "+UNUSED_SYMBOLS"           CONFIG_UNUSED_SYMBOLS --enable UNUSED_SYMBOLS
          SHIFT=6 probe "+MODULE_SIG"               CONFIG_MODULE_SIG     --enable MODULE_SIG
          SHIFT=6 probe "+DEBUG_MUTEXES"            CONFIG_DEBUG_MUTEXES  --enable DEBUG_MUTEXES
          SHIFT=6 probe "+DEBUG_SPINLOCK"           CONFIG_DEBUG_SPINLOCK --enable DEBUG_SPINLOCK
          SHIFT=6 probe "+DEBUG_SPINLOCK+DEBUG_MUTEXES" CONFIG_DEBUG_MUTEXES --enable DEBUG_SPINLOCK --enable DEBUG_MUTEXES
          SHIFT=6 probe "+DEBUG_LOCK_ALLOC"         CONFIG_DEBUG_LOCK_ALLOC --enable DEBUG_LOCK_ALLOC
          SHIFT=6 probe "+LOCKDEP"                  CONFIG_LOCKDEP        --enable LOCKDEP
          SHIFT=6 probe "+DEBUG_KOBJECT_RELEASE"    CONFIG_DEBUG_KOBJECT_RELEASE --enable DEBUG_KOBJECT_RELEASE
          SHIFT=6 probe "-SYSFS"                    CONFIG_SYSFS          --disable SYSFS
          SHIFT=6 probe "+DEBUG_KERNEL"             CONFIG_DEBUG_KERNEL   --enable DEBUG_KERNEL
          SHIFT=6 probe "+DEBUG_KERNEL+DEBUG_MUTEXES+DEBUG_SPINLOCK" CONFIG_DEBUG_SPINLOCK --enable DEBUG_KERNEL --enable DEBUG_MUTEXES --enable DEBUG_SPINLOCK
          SHIFT=6 probe "-MUTEX_SPIN_ON_OWNER"      CONFIG_MUTEX_SPIN_ON_OWNER --disable MUTEX_SPIN_ON_OWNER

          echo
          echo "################ 4. 在 L1SHIFT=6 基础上找 init→exit 的那 8 字节 ################"
          SHIFT=6 probe "-MODULES_TREE_LOOKUP"      CONFIG_MODULES_TREE_LOOKUP --disable MODULES_TREE_LOOKUP
          SHIFT=6 probe "-GENERIC_BUG"              CONFIG_GENERIC_BUG    --disable GENERIC_BUG
          SHIFT=6 probe "-KALLSYMS"                 CONFIG_KALLSYMS       --disable KALLSYMS
          SHIFT=6 probe "+TRACEPOINTS"              CONFIG_TRACEPOINTS    --enable TRACEPOINTS
          SHIFT=6 probe "+JUMP_LABEL"               CONFIG_JUMP_LABEL     --enable JUMP_LABEL
          SHIFT=6 probe "+LIVEPATCH"                CONFIG_LIVEPATCH      --enable LIVEPATCH

          echo
          echo "################ 5. 关键 config 现状（BASE）################"
          reset_cfg; set_cache_shift 7
          grep -E '^CONFIG_(UNUSED_SYMBOLS|MODULE_SIG|LIVEPATCH|GENERIC_BUG|MODULE_UNLOAD|KALLSYMS|KALLSYMS_ALL|SYSFS|DEBUG_KOBJECT_RELEASE|DEBUG_KERNEL|LOCKDEP|DEBUG_LOCK_ALLOC|DEBUG_SPINLOCK|MUTEX_SPIN_ON_OWNER|DEBUG_MUTEXES|MODULES_TREE_LOOKUP|TRACEPOINTS|TRACING|EVENT_TRACING|JUMP_LABEL|SMP|HAVE_MOD_ARCH_SPECIFIC)=' .config | sort
          echo "--- 未设置的 ---"
          grep -E '^# CONFIG_(DEBUG_KERNEL|DEBUG_MUTEXES|DEBUG_SPINLOCK|DEBUG_LOCK_ALLOC|LOCKDEP|UNUSED_SYMBOLS|MODULE_SIG|MODULES_TREE_LOOKUP|LIVEPATCH|TRACEPOINTS|JUMP_LABEL) is not set' .config | sort
