name: Build PenMods

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # 每周一 03:00 UTC 空跑一次。GitHub Actions 的 cache 只要 7 天没被访问
    # 就会被回收，cache 一没，xmake 就得从源码重装依赖（实测 +9 分钟：
    # 配置 xmake 从 ~20s 变成 567s，其中 267s 是在装 python 3.14.3）。
    # 这一条定时任务就是为了让 qt / xmake-packages / xmake-cache / build-objs
    # 四个缓存一直"活着"。
    - cron: '0 3 * * 1'
  workflow_dispatch:
    inputs:
      build_platform:
        description: '目标平台 (e.g. YDP02X)'
        required: true
        default: 'YDP02X'
      target_channel:
        description: '目标渠道'
        required: true
        default: 'dev'
      build_mode:
        description: '编译模式'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug

env:
  GCC_BASE_URL: https://github.com/Redbeanw44602/aarch64-linux-gnu-gcc-6.5.0/releases/download/6.5.0
  QT_DIR: ${{ github.workspace }}/qt-aarch64
  XMAKE_CACHE_DIR: ~/.xmake/cache
  XMAKE_PACKAGES_DIR: ~/.xmake/packages
  XMAKE_ROOT: y
  BUILD_PLATFORM: ${{ github.event.inputs.build_platform || 'YDP02X' }}
  TARGET_CHANNEL: ${{ github.event.inputs.target_channel || 'dev' }}
  BUILD_MODE: ${{ github.event.inputs.build_mode || 'release' }}

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
    permissions:
      contents: read
      # 清理旧缓存要写权限（见「清理旧缓存」那一步）
      actions: write

    steps:
      - name: 更新系统 & 安装基础依赖
        run: |
          pacman -Syy --noconfirm
          for i in 1 2 3; do
            pacman -Syu --noconfirm && break
            echo "pacman -Syu 第 $i 次失败，重试..."
            sleep 10
          done
          pacman -S --noconfirm \
            base-devel git zig wget curl zip \
            python3 ninja cmake nasm libxcrypt lame opencc qt5-tools qt5-base

      - name: 安装 aarch64-linux-gnu 工具链
        run: |
          wget -q "${{ env.GCC_BASE_URL }}/aarch64-linux-gnu-binutils-2.30-1-x86_64.pkg.tar.zst"
          wget -q "${{ env.GCC_BASE_URL }}/aarch64-linux-gnu-glibc-2.27-1-any.pkg.tar.zst"
          wget -q "${{ env.GCC_BASE_URL }}/aarch64-linux-gnu-gcc-6.5.0-1-x86_64.pkg.tar.zst"
          pacman -U --noconfirm \
            aarch64-linux-gnu-binutils-2.30-1-x86_64.pkg.tar.zst \
            aarch64-linux-gnu-glibc-2.27-1-any.pkg.tar.zst \
            aarch64-linux-gnu-gcc-6.5.0-1-x86_64.pkg.tar.zst
          aarch64-linux-gnu-gcc --version

      - name: 检出代码
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # 先清旧缓存再 restore：per-sha 的滚动缓存会一直累积，把仓库 10G 缓存额度
      # 挤满之后 GitHub 就按 LRU 把 xmake-packages / Qt 这些关键缓存删掉。
      # 实测被删之后的代价：现场重装 python 3.14.3(5m50s) + librime(2m28s)，
      # 只「配置 xmake」一步就要 12m40s。这里每个前缀只留最近几份。
      - name: 清理旧缓存
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request

          repo  = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          # 每个前缀保留的份数；0 = 全删（build-objs 已不再缓存，只清历史遗留）
          keep = {
              "xmake-cache-": 2,
              "build-objs-": 2,
              "xmake-packages-": 2,
              "qt-aarch64-": 2,
              "build-gens-": 0,
              "ccache-": 0,
          }

          def api(url, method="GET"):
              req = urllib.request.Request(
                  url, method=method,
                  headers={"Authorization": f"Bearer {token}",
                           "Accept": "application/vnd.github+json"})
              with urllib.request.urlopen(req) as r:
                  return json.load(r) if method == "GET" else None

          caches = api(f"https://api.github.com/repos/{repo}/actions/caches?per_page=100")
          groups = {}
          for c in caches.get("actions_caches", []):
              for pref in keep:
                  if c["key"].startswith(pref):
                      groups.setdefault(pref, []).append(c)
                      break
          for pref, items in groups.items():
              items.sort(key=lambda c: c["created_at"], reverse=True)
              for c in items[keep[pref]:]:
                  try:
                      api(f"https://api.github.com/repos/{repo}/actions/caches/{c['id']}", "DELETE")
                      print(f"deleted {c['key']} ({c['size_in_bytes']//1024//1024} MiB)")
                  except Exception as e:
                      print(f"delete failed {c['key']}: {e}")
          print("剩余：", {p: min(len(v), keep[p]) for p, v in groups.items()})
          PY

      - name: 缓存 Qt 5.15.2
        id: cache-qt
        uses: actions/cache@v4
        with:
          path: ${{ env.QT_DIR }}
          key: qt-aarch64-5.15.2

      - name: 缓存 Xmake 包
        uses: actions/cache@v4
        with:
          # 只缓存 packages：这里面是装好的依赖（python/librime/boost...），
          # 命中就能省掉「配置 xmake」里那一串 install。
          path: ${{ env.XMAKE_PACKAGES_DIR }}
          key: xmake-packages-${{ hashFiles('xmake.lua', 'xmake/**/*.lua') }}
          restore-keys: |
            xmake-packages-

      # 有了 xmake 自带的编译缓存（--policies=build.ccache,build.ccache.global_storage），
      # 全局缓存目录就在 XMAKE_CACHE_DIR 下，必须一起缓存，否则每次都全量重编
      # （实测 54 个 cpp + 57 个 moc 全部重编，约 4~7 分钟）。
      - name: 缓存 Xmake 编译缓存
        uses: actions/cache@v4
        with:
          path: ${{ env.XMAKE_CACHE_DIR }}
          key: xmake-cache-${{ env.BUILD_PLATFORM }}-${{ env.BUILD_MODE }}-${{ github.sha }}
          restore-keys: |
            xmake-cache-${{ env.BUILD_PLATFORM }}-${{ env.BUILD_MODE }}-

      - name: 缓存项目构建中间产物
        uses: actions/cache@v4
        with:
          path: |
            build/.build_cache
            build/.deps
            build/.gens
            build/.objs
          key: build-objs-${{ env.BUILD_PLATFORM }}-${{ env.BUILD_MODE }}-${{ github.sha }}
          restore-keys: |
            build-objs-${{ env.BUILD_PLATFORM }}-${{ env.BUILD_MODE }}-

      - name: 下载 Qt 5.15.2
        if: steps.cache-qt.outputs.cache-hit != 'true'
        run: |
          wget -q \
            https://github.com/Redbeanw44602/aarch64-linux-qt-5.15.2/releases/latest/download/aarch64-linux-qt-5.15.2.tar.gz \
            -O /tmp/qt.tar.gz
          mkdir -p ${{ env.QT_DIR }}
          tar -xzf /tmp/qt.tar.gz -C ${{ env.QT_DIR }}

      - name: 构建 fake qmake
        run: |
          g++ -fmax-errors=1 \
            -o "${{ env.QT_DIR }}/bin/qmake" \
            -D"PREFIX=\"${{ env.QT_DIR }}\"" \
            "${{ env.QT_DIR }}/bin/qmake.cpp"
          "${{ env.QT_DIR }}/bin/qmake"
          ${{ env.QT_DIR }}/bin/moc --version

      - name: 配置 xmake
        run: |
          pacman -U --noconfirm binary/xmake-git-3.0.3.r259-1-x86_64.pkg.tar.zst
          xmake repo -u
          sed -i \
            's|format("COMMAND\\n      %s/bin/opencc_dict", path.unix(package:dep("opencc"):installdir()))|"COMMAND\\n      /bin/opencc_dict"|g' \
            ~/.xmake/repositories/xmake-repo/packages/o/opencc/xmake.lua
          xmake f \
            --qt="${{ env.QT_DIR }}" \
            --arch=arm64-v8a \
            --build-platform=${{ env.BUILD_PLATFORM }} \
            --target-channel=${{ env.TARGET_CHANNEL }} \
            --toolchain=zig \
            --policies=build.ccache,build.ccache.global_storage \
            -m ${{ env.BUILD_MODE }} \
            -y \
            --cross=aarch64-linux-gnu.2.27

      - name: 编译 PenMods
        run: xmake build

      - name: 打包外部播放器
        run: |
          mkdir -p build/linux/arm64-v8a
          cp resource/player/player.zip build/linux/arm64-v8a/player.zip

      - name: 打包 Rime 输入法数据
        run: |
          mkdir -p build/linux/arm64-v8a
          cp resource/rime/rime.zip build/linux/arm64-v8a/rime.zip

      - name: 组装一键安装包
        run: |
          mkdir -p release
          cp build/linux/arm64-v8a/release/libPenMods.so release/
          cp build/linux/arm64-v8a/release/libPenModsResources.so release/
          cp build/linux/arm64-v8a/player.zip build/linux/arm64-v8a/rime.zip release/
          cp scripts/installer/install.py scripts/installer/start.cmd scripts/installer/README.md release/
          cp scripts/patch.sh release/patch.sh
          cp -r scripts/installer/misc release/misc
          cd release
          zip -r ../PenMods-YDP02X-Release.zip .
          cd ..
          cp PenMods-YDP02X-Release.zip build/linux/arm64-v8a/

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: PenMods-${{ env.BUILD_PLATFORM }}-${{ github.sha }}
          path: build/linux/arm64-v8a/
          retention-days: 7

      # 完整产物 ~70MB（里面还有 player.zip / rime.zip / 安装包），平时只是想换笔上
      # 那两个 .so 的话太慢，所以额外传一份只有 11MB 的精简产物。
      - name: 上传精简产物（只有两个 .so）
        uses: actions/upload-artifact@v4
        with:
          name: PenMods-libs-${{ env.BUILD_PLATFORM }}-${{ github.sha }}
          path: |
            build/linux/arm64-v8a/release/libPenMods.so
            build/linux/arm64-v8a/release/libPenModsResources.so
          retention-days: 7
