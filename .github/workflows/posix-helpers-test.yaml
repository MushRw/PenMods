name: posix helpers test

# 测三样"关键分支正常使用中走不到、走错了后果最痛"的 POSIX 原语：
#   * `util::RootFileSystemWritableGuard`（EX-04 / EX-05）—— rootfs 可写窗口的 RAII +
#     引用计数。走错了 = 只读 rootfs 被留在可写（本设备唯一"改不坏"的保险失效）；
#   * `_replaceFileAtomically`（EX-18）—— /etc/shadow 的同目录 tmp + fsync + rename。
#     走错了 = 毁掉全机唯一能登录的账户；
#   * `_randomSalt`（EX-19）—— 口令 salt 的 CSPRNG + 64 字符表映射。
#     走错了 = salt 退化成"只有几十种"，散列形同虚设。
#
# 为什么不做成 xmake 的一个 target：这份测试不链接 Qt、不参与 `libPenMods.so` 的构建，
# 就是一个几秒钟的小程序；而它要跑的地方（宿主机 / qemu / 真机）都跟 Qt 无关。
# 被测代码由 tests/posix-helpers/extract.py 从 System.{h,cpp} 与 ServiceManager.cpp
# **原样抽取**（remount 换成可控桩），不是手抄副本，所以源码漂移会立刻在这里暴露。
#
# 注意 `on.push` 不限定分支：`paths` 已经把触发面收得很窄（只有被测源码或测试文件变了
# 才跑），任何分支上动了这几处都该立刻验证。

on:
  workflow_dispatch:
  push:
    paths:
      - 'src/common/util/System.h'
      - 'src/common/util/System.cpp'
      - 'src/helper/ServiceManager.cpp'
      - 'src/helper/ServiceManager.h'
      - 'tests/posix-helpers/**'
      - '.github/workflows/posix-helpers-test.yaml'
  pull_request:
    paths:
      - 'src/common/util/System.h'
      - 'src/common/util/System.cpp'
      - 'src/helper/ServiceManager.cpp'
      - 'src/helper/ServiceManager.h'
      - 'tests/posix-helpers/**'

jobs:
  native:
    name: 原生 x86_64（全部断言有效）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 从源码抽取原语
        run: python3 tests/posix-helpers/extract.py --tree .

      - name: 编译
        run: |
          g++ -std=c++20 -O1 -g -Wall -Wextra -pthread \
            -I tests/posix-helpers/build \
            tests/posix-helpers/main.cpp \
            -o tests/posix-helpers/build/posix_helpers_test

      - name: 运行
        run: ./tests/posix-helpers/build/posix_helpers_test

  aarch64:
    name: aarch64 静态（qemu 冒烟 + 产出真机可用的二进制）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装交叉编译器与 qemu
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq g++-aarch64-linux-gnu qemu-user-static

      - name: 从源码抽取原语
        run: python3 tests/posix-helpers/extract.py --tree .

      # 必须 `-static`：真机的 glibc 是 2.27（见 build.yaml 里的 aarch64-linux-gnu.2.27），
      # 而 runner 上链接出来的动态可执行要求 glibc 2.38+，真机根本起不来。
      - name: 交叉编译（全静态）
        run: |
          aarch64-linux-gnu-g++ -std=c++20 -O1 -g -static -pthread \
            -I tests/posix-helpers/build \
            tests/posix-helpers/main.cpp \
            -o tests/posix-helpers/build/posix_helpers_test_aarch64
          file tests/posix-helpers/build/posix_helpers_test_aarch64
          ls -la tests/posix-helpers/build/posix_helpers_test_aarch64

      - name: qemu 冒烟（指令集侧）
        run: qemu-aarch64-static ./tests/posix-helpers/build/posix_helpers_test_aarch64

      - name: 上传真机可用的二进制
        uses: actions/upload-artifact@v4
        with:
          name: posix-helpers-test-aarch64-${{ github.sha }}
          path: tests/posix-helpers/build/posix_helpers_test_aarch64
          retention-days: 7
